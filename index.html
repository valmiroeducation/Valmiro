const $=(q,root=document)=>root.querySelector(q);
const $$=(q,root=document)=>Array.from(root.querySelectorAll(q));
const esc=x=>String(x).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const lesson=(title,lead,sections,task)=>({title,lead,sections,task});
const course=(id,code,title,group,summary,units,quiz)=>({id,code,title,group,summary,units,quiz});
const q=(title,options,correct,why)=>({title,options,correct,why});
const COURSES=[
course('viestiliikenne','RX','Viestiliikenne ja tilannekuva','Viestiliikenne','Radioliikenteen laatu, kutsurakenne, ristiriitaiset ilmoitukset ja tiedon varmistaminen.',[
lesson('Yhteinen tilannekuva','Radioliikenteen tehtävä ei ole vain saada ääntä perille, vaan tukea yhteistä käsitystä tilanteesta.',[
['Havainto ja tulkinta','Havainto on se, mitä itse näit tai kuulit. Tulkinta on oma päätelmäsi havainnon merkityksestä. Hyvässä ilmoituksessa nämä erotetaan. Esimerkiksi havaittu sijainti ei ole sama asia kuin oletettu määränpää.'],
['Ajantasaisuus','Viesti voi olla oikein lähettämishetkellä mutta vanhentua tilanteen muuttuessa. Jos uusi tieto korvaa aiemman, korjauksen täytyy olla vastaanottajalle selvä.'],
['Viestin rakenne','Yksilöi vastaanottaja ja lähettäjä organisaation ohjeiden mukaan. Kerro ydinasia ensimmäiseksi ja täsmennä vain tarpeelliset yksityiskohdat. Turha lisäpuhe kuluttaa yhteistä viestintäresurssia.']
],'Muodosta ilmoitus, joka erottaa havainnon, epävarman päätelmän ja tarvittavan lisäselvityksen.'),
lesson('Radiolaitteen toimintaperiaatteet','PTT, verkkoyhteys ja suorakanava käyttäytyvät eri tavoin eri laitteissa.',[
['Lähetyslupa','Laitteen antama lähetyslupa tai muu lähetyksen vahvistus on keskeinen. Jos lupaa ei tule, älä oleta viestiä vastaanotetuksi. Toimi laitteen ja kouluttajan ohjeiden mukaan.'],
['Verkkotila ja suorakanava','Verkkotilassa viestintä käyttää sille tarkoitettua verkkoa. Suorakanavalla yhteys toimii paikallisesti laitteiden välillä; kantama riippuu esimerkiksi maastosta ja rakennuksista.'],
['Turvallinen harjoittelu','Harjoituksiin sovitaan laitteet, toimintatilat ja käytettävät kanavat. Operatiivisia puheryhmiä, tunnuksia tai hätäpainiketta ei käytetä kokeilumielessä.']
],'Mitä voisit tarkistaa turvallisesti, jos harjoituslaite ei saa lähetyslupaa?'),
lesson('Kutsuminen ja kuittaukset','Harjoituksen tavoite on viestin yksiselitteisyys, ei tietyn sanamuodon opetteleminen kaikkia tilanteita varten.',[
['Kutsun kohdentaminen','Kutsuttavan ja kutsujan tunnusten käyttäminen auttaa tunnistamaan keskustelun osapuolet. Käytännöt riippuvat organisaatiosta ja harjoituksen ohjeista.'],
['Kuittauksen rajat','Vastaanotosta annettu kuittaus ei aina tarkoita, että tehtävä olisi suoritettu. Älä sekoita tiedon vastaanottoa, hyväksyntää ja toimeenpanoa.'],
['Toistaminen','Jos kriittinen osa viestistä on epäselvä, pyydä sen toistamista tai vahvistamista. Tarkentava kysymys ei ole epäonnistuminen vaan tiedon laadun varmistamista.']
],'Laadi lyhyt kuvitteellinen kutsu, viesti ja vastaanottokuittaus. Mitä tietoihin voisi jäädä epäselväksi?'),
lesson('Häiriöt ja ristiriidat','Yleinen viestinnän virhe on tehdä päätös yhden epäselvän ilmoituksen perusteella.',[
['Ristiriitainen sijainti','Jos kirjallinen rastiohje ja radiolla tullut ohje poikkeavat toisistaan, selvitä kumpi on voimassa. Pelkkä uudemman tai vanhemman valitseminen ei ole luotettava menetelmä.'],

function catalog(){const cats=['Kaikki',...new Set(COURSES.map(c=>c.group))];const matching=COURSES.filter(c=>(catalogCategory==='Kaikki'||c.group===catalogCategory)&&[c.title,c.summary,c.group].join(' ').toLowerCase().includes(catalogSearch.toLowerCase()));root.innerHTML=head('KURSSIKIRJASTO','Kaikki koulutukset','Valitse kiinnostava aihe. Kurssin eteneminen tallentuu omaan selaimeesi.')+`<section class="section shell"><div class="inline-search"><input class="search-input" id="catalogSearch" type="search" placeholder="Hae koulutuksia…" value="${esc(catalogSearch)}" aria-label="Hae koulutuksia"></div><div class="pills" id="catPills">${cats.map(c=>`<button data-cat="${esc(c)}" class="${catalogCategory===c?'selected':''}">${esc(c)}</button>`).join('')}</div><p class="smallprint">Sisällöt ovat itseopiskelua, eivät pätevyyksiä. Todellinen opiskeluaika riippuu siitä, miten perusteellisesti teet pohdintatehtävät.</p><div class="card-grid" id="courseResults" style="margin-top:25px">${matching.map(card).join('')||'<p>Ei hakua vastaavia koulutuksia.</p>'}</div></section>`;$('#catalogSearch').addEventListener('input',e=>{catalogSearch=e.target.value;const rows=COURSES.filter(c=>(catalogCategory==='Kaikki'||c.group===catalogCategory)&&[c.title,c.summary,c.group].join(' ').toLowerCase().includes(catalogSearch.toLowerCase()));$('#courseResults').innerHTML=rows.map(card).join('')||'<p>Ei hakua vastaavia koulutuksia.</p>'});$$('[data-cat]').forEach(b=>b.addEventListener('click',()=>{catalogCategory=b.dataset.cat;catalog()}));}

function lessonScreen(c,i){const u=c.units[i],done=(data.units[c.id]||[]).includes(i);$('#lessonMain').innerHTML=`<div class="lesson-topline"><span class="eyebrow">TEORIAOSIO ${i+1} / ${c.units.length}</span><span>Valmiro Learning</span></div><div class="theory-text"><h2>${esc(u.title)}</h2><p class="lead">${esc(u.lead)}</p>${u.sections.map(([heading,body])=>`<h3>${esc(heading)}</h3><p>${esc(body)}</p>`).join('')}<div class="callout"><b>Soveltava pohdinta</b><p>${esc(u.task)}</p><small>Kirjoita vastaus halutessasi omiin muistiinpanoihin. Tätä tehtävää ei tallenneta sivustolle.</small></div><div class="lesson-actions"><button class="btn btn-red" id="markUnit">${done?'Siirry seuraavaan →':'Merkitse opiskelluksi ja jatka →'}</button>${i>0?`<button class="btn btn-muted" data-go="/kurssi/${c.id}/${i-1}">← Edellinen</button>`:''}</div></div>`;$('#markUnit').addEventListener('click',()=>{const arr=data.units[c.id]||[];if(!arr.includes(i))arr.push(i);data.units[c.id]=arr;save();go(`/kurssi/${c.id}/${i===c.units.length-1?'koe':i+1}`)});}
function shuffled(n){const a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function examScreen(c){if(!examSession||examSession.id!==c.id)makeExam(c);const s=examSession;$('#lessonMain').innerHTML=`<div class="eyebrow">Loppukoe</div><h2>${esc(c.title)}</h2><div class="callout">${c.quiz.length} kysymystä · Läpäisyraja 80 % · Kysymysten ja vastausten järjestys vaihtuu uusintayrityksellä. <b>Valitse paras vastaus</b>, vaikka muutkin vaikuttaisivat mahdollisilta.</div><div id="questions">${s.order.map((qidx,i)=>{const qq=c.quiz[qidx];return `<fieldset class="quiz-question" style="border:0;padding-left:0;padding-right:0"><legend><h3>${i+1}. ${esc(qq.title)}</h3></legend>${s.options[i].map(optIdx=>`<label class="choice" data-q="${i}" data-o="${optIdx}"><input type="radio" name="q${i}" value="${optIdx}"><span>${esc(qq.options[optIdx])}</span></label>`).join('')}</fieldset>`}).join('')}</div><div id="examResult" aria-live="polite"></div><div class="lesson-actions"><button class="btn btn-red" id="gradeExam">Tarkista vastaukset</button><button class="btn btn-muted" id="restartExam">Uusi koeyritys</button></div>`;$('#gradeExam').addEventListener('click',()=>gradeExam(c));$('#restartExam').addEventListener('click',()=>{makeExam(c);examScreen(c)})}

function scenariosScreen(){root.innerHTML=head('TILANNEHARJOITUKSET','Päätöksentekoa muuttuvissa tilanteissa','Harjoittele tietojen tarkistamista, turvallisia valintoja ja havaintojen perustelemista.')+`<section class="section shell"><div class="callout">Kuvitteelliset harjoitukset eivät ole operatiivisia ohjeita. Käytännössä noudatetaan aina vastuuhenkilön tai hätäkeskuksen ohjeita.</div><div class="card-grid">${SCENARIOS.map((s,i)=>`<article class="course-card"><div class="card-banner"><strong>${String(i+1).padStart(2,'0')}</strong><small>${esc(s.category.toUpperCase())}</small></div><div class="card-body">${tag('6 PÄÄTÖSVAIHETTA')}<h3>${esc(s.title)}</h3><p>${esc(s.intro)}</p><div class="card-foot"><small>${data.scenes[s.id]===undefined?'Ei suoritettu':'Paras tulos '+data.scenes[s.id]+'%'}</small><button data-go="/tilanne/${s.id}">Aloita →</button></div></div></article>`).join('')}</div></section>`}
function sceneScreen(id){const s=sceneBy(id);if(!s)return;if(!sceneSession||sceneSession.id!==id)sceneSession={id,index:0,points:0,answered:false};const st=sceneSession;root.innerHTML=head('HARJOITUS / '+s.category.toUpperCase(),s.title,s.intro)+`<section class="section shell"><div class="panel scenario-screen" id="sceneArea"></div></section>`;drawScene(s)}
function drawScene(s){const st=sceneSession,area=$('#sceneArea');if(st.index>=s.steps.length){const score=Math.round(st.points/s.steps.length*100);data.scenes[s.id]=Math.max(data.scenes[s.id]??0,score);save();area.innerHTML=`<span class="chip green">HARJOITUS PÄÄTTYNYT</span><h2>${esc(s.title)}</h2><h3>${st.points}/${s.steps.length} perusteltua valintaa · ${score}%</h3><p class="lead">Harjoitus mittaa tämän kuvitteellisen tilanteen valintoja, ei todellista toimintakelpoisuutta.</p><div class="lesson-actions"><button class="btn btn-red" id="restartScene">Harjoittele uudelleen</button><button class="btn btn-muted" data-go="/tilanteet">Kaikki harjoitukset</button></div>`;$('#restartScene').addEventListener('click',()=>{sceneSession={id:s.id,index:0,points:0,answered:false};drawScene(s)});return}const stepData=s.steps[st.index];area.innerHTML=`<div class="scenario-context"><div class="eyebrow">HARJOITUSVAIHE ${st.index+1} / ${s.steps.length}</div><h2>${esc(s.title)}</h2><p>${esc(s.intro)}</p>${progressBar(Math.round(st.index/s.steps.length*100))}</div><h2 style="font-size:23px;line-height:1.4">${esc(stepData.s)}</h2><p class="lead">Valitse mielestäsi perustelluin toimintatapa.</p>${stepData.opts.map((text,i)=>`<button class="scene-choice" data-sceneopt="${i}"><b>${'ABC'[i]}.</b> ${esc(text)}</button>`).join('')}<div id="sceneFeedback" aria-live="polite"></div>`;$$('[data-sceneopt]').forEach(b=>b.addEventListener('click',()=>{if(st.answered)return;st.answered=true;const pick=Number(b.dataset.sceneopt),good=pick===stepData.correct;if(good)st.points++;$$('[data-sceneopt]').forEach(x=>x.disabled=true);$('#sceneFeedback').innerHTML=`<div class="scene-feedback ${good?'':'bad'}"><b>${good?'Perusteltu ratkaisu':'Valintaan liittyy ongelma'}</b><p>${esc(stepData.feedback)}</p></div><button id="nextScene" class="btn btn-red">${st.index===s.steps.length-1?'Näytä yhteenveto':'Jatka seuraavaan →'}</button>`;$('#nextScene').addEventListener('click',()=>{st.index++;st.answered=false;drawScene(s);window.scrollTo({top:0,behavior:'smooth'})})}))}
function progressScreen(){const done=COURSES.filter(passed).length,attempts=COURSES.filter(c=>data.exams[c.id]!==undefined),avg=attempts.length?Math.round(attempts.reduce((a,c)=>a+data.exams[c.id],0)/attempts.length)+'%':'–';root.innerHTML=head('OMA OPPIMINEN','Edistymisen seuranta','Tiedot säilyvät tämän laitteen selaimessa, eivät palvelimella.')+`<section class="section shell"><div class="stat-grid"><div class="stat"><strong>${done}/${COURSES.length}</strong><span>Hyväksyttyä kurssia</span></div><div class="stat"><strong>${avg}</strong><span>Yritettyjen kurssien parhaiden tulosten keskiarvo</span></div><div class="stat"><strong>${Object.keys(data.scenes).length}/${SCENARIOS.length}</strong><span>Harjoiteltua tilannetta</span></div></div><div class="panel" style="margin-top:22px"><h2>Kurssikohtaiset tulokset</h2>${COURSES.map(c=>`<div style="border-top:1px solid var(--line);padding:19px 0"><b>${esc(c.title)}</b><p class="smallprint">${completed(c)}/${c.units.length} teoriaosiota · Paras koe ${data.exams[c.id]===undefined?'ei suoritettu':data.exams[c.id]+'%'}</p>${progressBar(completion(c))}<button class="btn btn-muted btn-small" style="margin-top:12px" data-go="/kurssi/${c.id}/0">Avaa →</button></div>`).join('')}<p class="smallprint">Tiedot voidaan menettää selaintietoja poistettaessa. Niitä ei siirretä toiselle laitteelle.</p><button id="resetAll" class="btn btn-muted">Poista suoritustiedot</button></div></section>`;$('#resetAll').addEventListener('click',()=>{if(confirm('Poistetaanko kaikki tämän selaimen Valmiro-suoritukset?')){data=empty();save();progressScreen()}})}

 }else if(t.type==='essay'){

function drawOrder(t){
 const element=$('#ordered');if(!element)return;
 element.innerHTML=taskOrder.map((idx,pos)=>`<div class="v5-card v5-row" style="margin-bottom:9px"><b style="width:25px;color:#ff9296">${pos+1}</b><span style="flex:1">${esc(t.parts[idx])}</span><button class="v5-smallbtn" data-move="${pos},-1" ${pos===0?'disabled':''} aria-label="Siirrä ylös">↑</button><button class="v5-smallbtn" data-move="${pos},1" ${pos===taskOrder.length-1?'disabled':''} aria-label="Siirrä alas">↓</button></div>`).join('');
 $$('[data-move]',element).forEach(btn=>btn.addEventListener('click',()=>{
  const [at,delta]=btn.dataset.move.split(',').map(Number);
  const dest=at+delta;if(dest<0||dest>=taskOrder.length)return;
  [taskOrder[at],taskOrder[dest]]=[taskOrder[dest],taskOrder[at]];
  drawOrder(t);
 }));
}
function evaluateTask(){
 const t=currentTask,out=$('#taskResult');let good=false,message='';
 if(t.type==='order'){
  good=taskOrder.every((idx,pos)=>idx===pos);
  message=`${good?'Kaikki vaiheet oikein.':'Järjestyksessä on vielä korjattavaa.'} ${t.explain}`;
 }else if(t.type==='multi'){
  const chosen=$$('.multiAnswer:checked').map(e=>Number(e.value)).sort((a,b)=>a-b);
  good=JSON.stringify(chosen)===JSON.stringify(t.right);
  message=`${good?'Valinnat ovat oikein.':'Valinnoissa on puutteita tai ylimääräisiä kohtia.'} ${t.explain}`;
 }else if(t.type==='number'){
  const value=Number($('#statAnswer').value.replace(',','.'));
  good=$('#statAnswer').value.trim()!==''&&Math.abs(value-t.answer)<=0.11;
  message=`${good?'Lasku oikein.':'Tarkista laskutapa.'} ${t.explain}`;
 }else{
  const value=$('#essayAnswer').value.trim();
  if(value.length<60){out.innerHTML='<div class="v5-feedback warn">Kirjoita perustelu hieman laajemmin ennen itsearviointia.</div>';return;}
  message='Vertaa vastaustasi arviointikriteereihin. Tämä ei ole automaattisesti arvioitu koe: <ul>'+t.rubric.map(r=>`<li>${esc(r)}</li>`).join('')+'</ul>';
 }
 if(good){tasksDone[t.id]=true;storeSet(STORAGE_QUIZ,tasksDone);}
 out.innerHTML=`<div class="v5-feedback ${!good&&t.type!=='essay'?'warn':''}"><strong>${t.type==='essay'?'Itsearviointi':good?'Hyväksytty harjoitus':'Pohdi uudelleen'}</strong><div>${message}</div></div>`;
 out.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function renderPlannerLists(){
 const u=$('#planUnits'),c=$('#planCards');if(!u||!c)return;
 u.innerHTML=plan.units.map((item,i)=>`<div class="v5-card"><div class="v5-row"><b style="flex:1">Yksikkö ${i+1}</b><button class="v5-smallbtn" data-delete-unit="${i}">Poista</button></div><div class="v5-grid">${['name','call','role'].map(k=>`<label class="v5-label">${{name:'Yksikön nimi',call:'Radiotunnus',role:'Rooli'}[k]}<input class="v5-input" data-unit="${i}" data-unit-key="${k}" value="${esc(item[k])}"></label>`).join('')}</div><label class="v5-label">Yksikön palaute</label><textarea class="v5-textarea feedback-area" data-unit="${i}" data-unit-key="feedback" placeholder="Tilanteen kulku, havainnot, kehittämiskohdat…">${esc(item.feedback)}</textarea></div>`).join('');
 c.innerHTML=plan.cards.map((item,i)=>`<div class="v5-card"><div class="v5-row"><b style="flex:1">Tilannekortti ${i+1}</b><button class="v5-smallbtn" data-delete-card="${i}">Poista</button></div>${['phase','target','trigger','expected'].map(k=>`<label class="v5-label">${{phase:'Vaiheen nimi',target:'Yksikkö / vastaanottaja',trigger:'Tilanne ja uusi tieto',expected:'Odotettu toiminta / arviointikohta'}[k]}</label><textarea class="v5-textarea" style="min-height:${k==='trigger'||k==='expected'?90:57}px" data-card="${i}" data-card-key="${k}">${esc(item[k])}</textarea>`).join('')}</div>`).join('');
 $$('[data-unit]',u).forEach(input=>input.addEventListener('input',()=>{plan.units[Number(input.dataset.unit)][input.dataset.unitKey]=input.value;persistPlan();}));
 $$('[data-card]',c).forEach(input=>input.addEventListener('input',()=>{plan.cards[Number(input.dataset.card)][input.dataset.cardKey]=input.value;persistPlan();}));
 $$('[data-delete-unit]',u).forEach(btn=>btn.addEventListener('click',()=>{if(plan.units.length<2){alert('Jätä vähintään yksi harjoitusyksikkö.');return;}plan.units.splice(Number(btn.dataset.deleteUnit),1);persistPlan();renderPlannerLists();}));
 $$('[data-delete-card]',c).forEach(btn=>btn.addEventListener('click',()=>{plan.cards.splice(Number(btn.dataset.deleteCard),1);persistPlan();renderPlannerLists();}));
 $('#plannerUnits').textContent=plan.units.length;$('#plannerCards').textContent=plan.cards.length;
}
function downloadJSON(obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=el('a',{href:url,download:'valmiro-harjoitus.json'});a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function importJSON(event){
 const file=event.target.files?.[0];if(!file)return;
 if(file.size>1024*1024){alert('Tiedosto on liian suuri (enintään 1 Mt).');return;}
 try{
  const incoming=JSON.parse(await file.text());
  if(typeof incoming.title!=='string'||!Array.isArray(incoming.units)||!Array.isArray(incoming.cards)||incoming.units.length>30||incoming.cards.length>100)throw Error('invalid');
  const allowed=(value)=>String(value??'').slice(0,4000);
  plan={id:'p_'+Date.now(),title:allowed(incoming.title),date:allowed(incoming.date),duration:allowed(incoming.duration),place:allowed(incoming.place),group:allowed(incoming.group),leader:allowed(incoming.leader),goals:allowed(incoming.goals),safety:allowed(incoming.safety),notes:allowed(incoming.notes),finalFeedback:allowed(incoming.finalFeedback),units:incoming.units.map((u,i)=>({id:'u'+i,name:allowed(u.name),call:allowed(u.call),role:allowed(u.role),feedback:allowed(u.feedback)})),cards:incoming.cards.map((c,i)=>({id:'c'+i,phase:allowed(c.phase),target:allowed(c.target),trigger:allowed(c.trigger),expected:allowed(c.expected)}))};
  persistPlan();plannerScreen();
 }catch{alert('Tiedoston sisältö ei ole Valmiron harjoitussuunnitelma.');}
}
function printPlanner(){
 const target=$('#valmiroPrint');if(!target)return;
 target.innerHTML=`<section class="print-page"><div style="color:#bc2631;font-weight:bold;letter-spacing:3px">VALMIRO / KOULUTTAJAKESKUS</div><h1>${esc(plan.title)}</h1><div class="print-meta"><p><b>Harjoituspäivä:</b> ${esc(plan.date||'________')}<br><b>Paikka:</b> ${esc(plan.place)}<br><b>Vastuukouluttaja:</b> ${esc(plan.leader||'________')}<br><b>Kohderyhmä:</b> ${esc(plan.group)}<br><b>Kesto:</b> ${esc(plan.duration)} min</p></div><h2>Oppimistavoitteet</h2><p>${esc(plan.goals)}</p><h2>Harjoituksen kulku</h2><p>${esc(plan.notes)}</p><h2>Turvallisuus</h2><p>${esc(plan.safety)}</p></section>`+
 `<section class="print-page"><h1>Yksikköluettelo</h1><table><thead><tr><th>Yksikkö</th><th>Tunnus</th><th>Tehtävä</th></tr></thead><tbody>${plan.units.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.call)}</td><td>${esc(u.role)}</td></tr>`).join('')}</tbody></table><h2>Kouluttajan muistiinpanot</h2><div class="print-answer big"></div><div class="print-answer big"></div></section>`+
 plan.units.map((u,i)=>`<section class="print-page"><p style="color:#bf3339;font-weight:bold">YKSIKKÖKORTTI ${i+1}</p><h1>${esc(u.name)}</h1><p><b>Kutsutunnus:</b> ${esc(u.call)}</p><p><b>Tehtävä:</b> ${esc(u.role)}</p><h2>Yksikön muistiinpanot</h2><div class="print-answer big"></div><h2>Kouluttajan palaute</h2><p>${esc(u.feedback)}</p>${'<div class="print-answer big"></div>'.repeat(3)}</section>`).join('')+
 plan.cards.map((c,i)=>`<section class="print-page"><p style="color:#bf3339;font-weight:bold">TILANNEKORTTI ${i+1}</p><h1>${esc(c.phase)}</h1><div class="print-card"><b>Vastaanottaja / yksikkö:</b> ${esc(c.target)}</div><h2>Tilanne ja annetut tiedot</h2><p>${esc(c.trigger)}</p><h2>Odotettu toiminta</h2><p>${esc(c.expected)}</p><h2>Harjoituksen havainnot</h2><div class="print-answer big"></div><div class="print-answer big"></div></section>`).join('')+
 `<section class="print-page"><h1>Yhteenveto ja arviointi</h1><p>${esc(plan.finalFeedback)}</p>${'<div class="print-answer big"></div>'.repeat(4)}<p><small>Valmiron harjoitussuunnitelma · Käyttö kouluttajan vastuulla.</small></p></section>`;
 document.body.classList.add('v5-printing');
 const finish=()=>{document.body.classList.remove('v5-printing');};
 window.addEventListener('afterprint',finish,{once:true});
 window.print();
 setTimeout(finish,3000);
}

 `<section class="section shell"><div class="v5-layout"><div><article class="v5-panel enhance-hero"><div class="eyebrow">MIKSI VALMIRO?</div><h2>Hyvä palokuntalainen oppii jatkuvasti.</h2><p>Valmiro kokoaa yhteen teoriaa, harjoituskysymyksiä, tilanneharjoituksia ja kouluttajien työkaluja. Tavoitteena on madaltaa kynnystä perehtyä turvallisuus- ja pelastusalan aiheisiin myös viikkoharjoitusten ulkopuolella.</p><p>Palvelu on rakennettu erityisesti nuorten itsenäiseen opiskeluun ja kouluttajien harjoitussuunnittelun tueksi. Käyttäjä voi tarkastella materiaaleja ilman tiliä.</p><div class="v5-grid" style="margin:25px 0"><div class="v5-stat"><strong>${COURSES.length}</strong><small>Oppimiskokonaisuutta</small></div><div class="v5-stat"><strong>${SCENARIOS.length}</strong><small>Monivaiheista tilannetta</small></div></div><hr class="v5-rule"><h3>Miten palvelu syntyy?</h3><p>Valmiron sisällöt ovat omaa oppimateriaalia, jota kehitetään julkisten viranomais- ja järjestölähteiden perusteella. Sivusto ei myönnä virallisia pätevyyksiä eikä esitä materiaalejaan virallisesti hyväksyttyinä koulutusohjeina.</p><h3>Ajantasaisuus ja lähteet</h3><p>Palokuntanuorten koulutuspolut kehittyvät. Oppisisältöjä päivitetään, kun lähteet tai koulutuskäytännöt muuttuvat. Pelastustoiminnan käytännön harjoituksissa noudatetaan oman kouluttajan ja organisaation ohjeita.</p><ul>${sourcesHtml()}</ul><h3>Yhteys ja palaute</h3><p>Tekninen ongelma, korjausehdotus tai palaute: <a href="mailto:help.valmiro@gmail.com">help.valmiro@gmail.com</a>. Älä lähetä potilastietoja tai muita arkaluonteisia henkilötietoja.</p></article></div><aside class="v5-panel"><div class="eyebrow">PALVELUN OSAT</div><h2>Opi. Harjoittele. Kehity.</h2><div class="v5-list"><div class="v5-card"><b>Kurssikirjasto</b><p class="v5-muted">Teoriaa ja osaamisen arviointia.</p></div><div class="v5-card"><b>Kokeet</b><p class="v5-muted">Valintatehtävät, järjestykset, tilastot ja perustelut.</p></div><div class="v5-card"><b>Kouluttajakeskus<  `<section class="section shell"><article class="v5-panel" style="max-width:920px;margin:auto"><h2>1. Palvelun yhteystiedot</h2><p>Valmiron yhteysosoite on <a href="mailto:help.valmiro@gmail.com">help.valmiro@gmail.com</a>. <b>Julkaisijalle:</b> täydennä tähän vastuullisen rekisterinpitäjän tunnistetiedot ennen julkista käyttöönottoa. Pelkkä palvelunimi ei aina riitä tietosuojailmoitukseen.</p><h2>2. IP-osoitteet ja tekniset lokit</h2><p>Valmiro käyttää GitHub Pages -julkaisualustaa. GitHub kertoo tallentavansa kävijöiden IP-osoitteita turvallisuustarkoituksiin. Valmiro ei tarjoa omaa IP-osoitteiden hakua tai analytiikkaa, eikä tämä evästevalinta estä GitHubin palvelinlokeja.</p><h2>3. Oppimissuoritukset ja suunnitelmat</h2><p>Jos sallit valinnaisen paikallisen tallennuksen, selaimesi localStorageen tallennetaan teoriaosioiden merkinnät, parhaat koepisteet, harjoitusten tulokset ja itse luomasi kouluttajasuunnitelmat. Tiedot eivät lähde Valmiron omaan palvelintietokantaan.</p><p>Jos kieltäydyt valinnaisesta tallennuksesta, voit silti käyttää sisältöjä, mutta tiedot eivät säily sivun sulkemisen jälkeen. Voit milloin tahansa muuttaa valintaa ja poistaa paikalliset tiedot evästeasetuksista.</p><h2>4. Evästeet ja vastaavat tekniikat</h2><p>Tämä toteutus ei lisää mainonta- tai analytiikkaevästeitä. Sivusto tallentaa ainoastaan valintasi muistavan asetuksen (localStorage). Varsinainen oppimishistoria tallennetaan vain, jos hyväksyt sen erikseen. Valinnan voi vaihtaa sivuston alareunan <b>Evästeasetukset</b>-linkistä.</p><h2>5. Sähköpostiviestit</h2><p>Jos lähetät viestin tukiosoitteeseen, sähköpostipalvelu käsittelee lähettäjän osoitteen ja viestin sisältöä yhteydenottoon vastaamiseksi. Älä lähetä salassa pidettäviä, potilas- tai muita arkaluonteisia tietoja. Ylläpitäjän on ennen julkaisua täsmennettävä sähköpostitietojen käsittelyperuste, vastaanottajat ja säilytysaika.</p><h2>6. Säilytys ja oikeudet</h2><p>Paikallinen oppimishistoria säilyy selaimessa, kunnes poistat sen tai selaimen tallennustiedot poistuvat. GitHubin teknisten lokien säilytysaikaa hallinnoi GitHub oman tietosuojakäytäntönsä mukaisesti. Henkilötietojen käsittelyyn voi soveltua GDPR:n mukaisia tiedonsaanti-, oikaisu- ja poistamisoikeuksia; yhteystiedoista saa lisätietoa.</p><h2>7. Kolmannet osapuolet</h2><p>Sivun tekninen julkaisu tapahtuu GitHub Pagesin kautta. Linkkien avaaminen ulkoisiin lähteisiin vie kyseisen palveluntarjoajan verkkosivustolle.</p><hr class="v5-rule"><button class="btn btn-red" id="privacySettings">Avaa evästeasetukset</button><p class="v5-muted">Huomautus ylläpitäjälle: tämä on toteutusta kuvaava tietosuoja- ja tallennustekstin pohja, ei valmis oikeudellinen tarkastus.</p></article></section>`;
