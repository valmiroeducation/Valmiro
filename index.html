const $=(q,root=document)=>root.querySelector(q);
const $$=(q,root=document)=>Array.from(root.querySelectorAll(q));
const esc=x=>String(x).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const lesson=(title,lead,sections,task)=>({title,lead,sections,task});
const course=(id,code,title,group,summary,units,quiz)=>({id,code,title,group,summary,units,quiz});
const q=(title,options,correct,why)=>({title,options,correct,why});
const COURSES=[
course('viestiliikenne','RX','Viestiliikenne ja tilannekuva','Viestiliikenne','Radioliikenteen laatu, kutsurakenne, ristiriitaiset ilmoitukset ja tiedon varmistaminen.',[
lesson('Yhteinen tilannekuva','Radioliikenteen tehtävä ei ole vain saada ääntä perille, vaan tukea yhteistä käsitystä tilanteesta.',[
['Havainto ja tulkinta','Havainto on se, mitä itse näit tai kuulit. Tulkinta on oma päätelmäsi havainnon merkityksestä. Hyvässä ilmoituksessa nämä erotetaan. Esimerkiksi havaittu sijainti ei ole sama asia kuin oletettu määränpää.'],
['Ajantasaisuus','Viesti voi olla oikein lähettämishetkellä mutta vanhentua tilanteen muuttuessa. Jos uusi tieto korvaa aiemman, korjauksen täytyy olla vastaanottajalle selvä.'],
['Viestin rakenne','Yksilöi vastaanottaja ja lähettäjä organisaation ohjeiden mukaan. Kerro ydinasia ensimmäiseksi ja täsmennä vain tarpeelliset yksityiskohdat. Turha lisäpuhe kuluttaa yhteistä viestintäresurssia.']
],'Muodosta ilmoitus, joka erottaa havainnon, epävarman päätelmän ja tarvittavan lisäselvityksen.'),
lesson('Radiolaitteen toimintaperiaatteet','PTT, verkkoyhteys ja suorakanava käyttäytyvät eri tavoin eri laitteissa.',[
['Lähetyslupa','Laitteen antama lähetyslupa tai muu lähetyksen vahvistus on keskeinen. Jos lupaa ei tule, älä oleta viestiä vastaanotetuksi. Toimi laitteen ja kouluttajan ohjeiden mukaan.'],
['Verkkotila ja suorakanava','Verkkotilassa viestintä käyttää sille tarkoitettua verkkoa. Suorakanavalla yhteys toimii paikallisesti laitteiden välillä; kantama riippuu esimerkiksi maastosta ja rakennuksista.'],
['Turvallinen harjoittelu','Harjoituksiin sovitaan laitteet, toimintatilat ja käytettävät kanavat. Operatiivisia puheryhmiä, tunnuksia tai hätäpainiketta ei käytetä kokeilumielessä.']
],'Mitä voisit tarkistaa turvallisesti, jos harjoituslaite ei saa lähetyslupaa?'),
lesson('Kutsuminen ja kuittaukset','Harjoituksen tavoite on viestin yksiselitteisyys, ei tietyn sanamuodon opetteleminen kaikkia tilanteita varten.',[
['Kutsun kohdentaminen','Kutsuttavan ja kutsujan tunnusten käyttäminen auttaa tunnistamaan keskustelun osapuolet. Käytännöt riippuvat organisaatiosta ja harjoituksen ohjeista.'],
['Kuittauksen rajat','Vastaanotosta annettu kuittaus ei aina tarkoita, että tehtävä olisi suoritettu. Älä sekoita tiedon vastaanottoa, hyväksyntää ja toimeenpanoa.'],
['Toistaminen','Jos kriittinen osa viestistä on epäselvä, pyydä sen toistamista tai vahvistamista. Tarkentava kysymys ei ole epäonnistuminen vaan tiedon laadun varmistamista.']
],'Laadi lyhyt kuvitteellinen kutsu, viesti ja vastaanottokuittaus. Mitä tietoihin voisi jäädä epäselväksi?'),
lesson('Häiriöt ja ristiriidat','Yleinen viestinnän virhe on tehdä päätös yhden epäselvän ilmoituksen perusteella.',[
['Ristiriitainen sijainti','Jos kirjallinen rastiohje ja radiolla tullut ohje poikkeavat toisistaan, selvitä kumpi on voimassa. Pelkkä uudemman tai vanhemman valitseminen ei ole luotettava menetelmä.'],

function catalog(){const cats=['Kaikki',...new Set(COURSES.map(c=>c.group))];const matching=COURSES.filter(c=>(catalogCategory==='Kaikki'||c.group===catalogCategory)&&[c.title,c.summary,c.group].join(' ').toLowerCase().includes(catalogSearch.toLowerCase()));root.innerHTML=head('KURSSIKIRJASTO','Kaikki koulutukset','Valitse kiinnostava aihe. Kurssin eteneminen tallentuu omaan selaimeesi.')+`<section class="section shell"><div class="inline-search"><input class="search-input" id="catalogSearch" type="search" placeholder="Hae koulutuksia…" value="${esc(catalogSearch)}" aria-label="Hae koulutuksia"></div><div class="pills" id="catPills">${cats.map(c=>`<button data-cat="${esc(c)}" class="${catalogCategory===c?'selected':''}">${esc(c)}</button>`).join('')}</div><p class="smallprint">Sisällöt ovat itseopiskelua, eivät pätevyyksiä. Todellinen opiskeluaika riippuu siitä, miten perusteellisesti teet pohdintatehtävät.</p><div class="card-grid" id="courseResults" style="margin-top:25px">${matching.map(card).join('')||'<p>Ei hakua vastaavia koulutuksia.</p>'}</div></section>`;$('#catalogSearch').addEventListener('input',e=>{catalogSearch=e.target.value;const rows=COURSES.filter(c=>(catalogCategory==='Kaikki'||c.group===catalogCategory)&&[c.title,c.summary,c.group].join(' ').toLowerCase().includes(catalogSearch.toLowerCase()));$('#courseResults').innerHTML=rows.map(card).join('')||'<p>Ei hakua vastaavia koulutuksia.</p>'});$$('[data-cat]').forEach(b=>b.addEventListener('click',()=>{catalogCategory=b.dataset.cat;catalog()}));}

function lessonScreen(c,i){const u=c.units[i],done=(data.units[c.id]||[]).includes(i);$('#lessonMain').innerHTML=`<div class="lesson-topline"><span class="eyebrow">TEORIAOSIO ${i+1} / ${c.units.length}</span><span>Valmiro Learning</span></div><div class="theory-text"><h2>${esc(u.title)}</h2><p class="lead">${esc(u.lead)}</p>${u.sections.map(([heading,body])=>`<h3>${esc(heading)}</h3><p>${esc(body)}</p>`).join('')}<div class="callout"><b>Soveltava pohdinta</b><p>${esc(u.task)}</p><small>Kirjoita vastaus halutessasi omiin muistiinpanoihin. Tätä tehtävää ei tallenneta sivustolle.</small></div><div class="lesson-actions"><button class="btn btn-red" id="markUnit">${done?'Siirry seuraavaan →':'Merkitse opiskelluksi ja jatka →'}</button>${i>0?`<button class="btn btn-muted" data-go="/kurssi/${c.id}/${i-1}">← Edellinen</button>`:''}</div></div>`;$('#markUnit').addEventListener('click',()=>{const arr=data.units[c.id]||[];if(!arr.includes(i))arr.push(i);data.units[c.id]=arr;save();go(`/kurssi/${c.id}/${i===c.units.length-1?'koe':i+1}`)});}
function shuffled(n){const a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function examScreen(c){if(!examSession||examSession.id!==c.id)makeExam(c);const s=examSession;$('#lessonMain').innerHTML=`<div class="eyebrow">Loppukoe</div><h2>${esc(c.title)}</h2><div class="callout">${c.quiz.length} kysymystä · Läpäisyraja 80 % · Kysymysten ja vastausten järjestys vaihtuu uusintayrityksellä. <b>Valitse paras vastaus</b>, vaikka muutkin vaikuttaisivat mahdollisilta.</div><div id="questions">${s.order.map((qidx,i)=>{const qq=c.quiz[qidx];return `<fieldset class="quiz-question" style="border:0;padding-left:0;padding-right:0"><legend><h3>${i+1}. ${esc(qq.title)}</h3></legend>${s.options[i].map(optIdx=>`<label class="choice" data-q="${i}" data-o="${optIdx}"><input type="radio" name="q${i}" value="${optIdx}"><span>${esc(qq.options[optIdx])}</span></label>`).join('')}</fieldset>`}).join('')}</div><div id="examResult" aria-live="polite"></div><div class="lesson-actions"><button class="btn btn-red" id="gradeExam">Tarkista vastaukset</button><button class="btn btn-muted" id="restartExam">Uusi koeyritys</button></div>`;$('#gradeExam').addEventListener('click',()=>gradeExam(c));$('#restartExam').addEventListener('click',()=>{makeExam(c);examScreen(c)})}

function scenariosScreen(){root.innerHTML=head('TILANNEHARJOITUKSET','Päätöksentekoa muuttuvissa tilanteissa','Harjoittele tietojen tarkistamista, turvallisia valintoja ja havaintojen perustelemista.')+`<section class="section shell"><div class="callout">Kuvitteelliset harjoitukset eivät ole operatiivisia ohjeita. Käytännössä noudatetaan aina vastuuhenkilön tai hätäkeskuksen ohjeita.</div><div class="card-grid">${SCENARIOS.map((s,i)=>`<article class="course-card"><div class="card-banner"><strong>${String(i+1).padStart(2,'0')}</strong><small>${esc(s.category.toUpperCase())}</small></div><div class="card-body">${tag('6 PÄÄTÖSVAIHETTA')}<h3>${esc(s.title)}</h3><p>${esc(s.intro)}</p><div class="card-foot"><small>${data.scenes[s.id]===undefined?'Ei suoritettu':'Paras tulos '+data.scenes[s.id]+'%'}</small><button data-go="/tilanne/${s.id}">Aloita →</button></div></div></article>`).join('')}</div></section>`}
function sceneScreen(id){const s=sceneBy(id);if(!s)return;if(!sceneSession||sceneSession.id!==id)sceneSession={id,index:0,points:0,answered:false};const st=sceneSession;root.innerHTML=head('HARJOITUS / '+s.category.toUpperCase(),s.title,s.intro)+`<section class="section shell"><div class="panel scenario-screen" id="sceneArea"></div></section>`;drawScene(s)}
function drawScene(s){const st=sceneSession,area=$('#sceneArea');if(st.index>=s.steps.length){const score=Math.round(st.points/s.steps.length*100);data.scenes[s.id]=Math.max(data.scenes[s.id]??0,score);save();area.innerHTML=`<span class="chip green">HARJOITUS PÄÄTTYNYT</span><h2>${esc(s.title)}</h2><h3>${st.points}/${s.steps.length} perusteltua valintaa · ${score}%</h3><p class="lead">Harjoitus mittaa tämän kuvitteellisen tilanteen valintoja, ei todellista toimintakelpoisuutta.</p><div class="lesson-actions"><button class="btn btn-red" id="restartScene">Harjoittele uudelleen</button><button class="btn btn-muted" data-go="/tilanteet">Kaikki harjoitukset</button></div>`;$('#restartScene').addEventListener('click',()=>{sceneSession={id:s.id,index:0,points:0,answered:false};drawScene(s)});return}const stepData=s.steps[st.index];area.innerHTML=`<div class="scenario-context"><div class="eyebrow">HARJOITUSVAIHE ${st.index+1} / ${s.steps.length}</div><h2>${esc(s.title)}</h2><p>${esc(s.intro)}</p>${progressBar(Math.round(st.index/s.steps.length*100))}</div><h2 style="font-size:23px;line-height:1.4">${esc(stepData.s)}</h2><p class="lead">Valitse mielestäsi perustelluin toimintatapa.</p>${stepData.opts.map((text,i)=>`<button class="scene-choice" data-sceneopt="${i}"><b>${'ABC'[i]}.</b> ${esc(text)}</button>`).join('')}<div id="sceneFeedback" aria-live="polite"></div>`;$$('[data-sceneopt]').forEach(b=>b.addEventListener('click',()=>{if(st.answered)return;st.answered=true;const pick=Number(b.dataset.sceneopt),good=pick===stepData.correct;if(good)st.points++;$$('[data-sceneopt]').forEach(x=>x.disabled=true);$('#sceneFeedback').innerHTML=`<div class="scene-feedback ${good?'':'bad'}"><b>${good?'Perusteltu ratkaisu':'Valintaan liittyy ongelma'}</b><p>${esc(stepData.feedback)}</p></div><button id="nextScene" class="btn btn-red">${st.index===s.steps.length-1?'Näytä yhteenveto':'Jatka seuraavaan →'}</button>`;$('#nextScene').addEventListener('click',()=>{st.index++;st.answered=false;drawScene(s);window.scrollTo({top:0,behavior:'smooth'})})}))}
function progressScreen(){const done=COURSES.filter(passed).length,attempts=COURSES.filter(c=>data.exams[c.id]!==undefined),avg=attempts.length?Math.round(attempts.reduce((a,c)=>a+data.exams[c.id],0)/attempts.length)+'%':'–';root.innerHTML=head('OMA OPPIMINEN','Edistymisen seuranta','Tiedot säilyvät tämän laitteen selaimessa, eivät palvelimella.')+`<section class="section shell"><div class="stat-grid"><div class="stat"><strong>${done}/${COURSES.length}</strong><span>Hyväksyttyä kurssia</span></div><div class="stat"><strong>${avg}</strong><span>Yritettyjen kurssien parhaiden tulosten keskiarvo</span></div><div class="stat"><strong>${Object.keys(data.scenes).length}/${SCENARIOS.length}</strong><span>Harjoiteltua tilannetta</span></div></div><div class="panel" style="margin-top:22px"><h2>Kurssikohtaiset tulokset</h2>${COURSES.map(c=>`<div style="border-top:1px solid var(--line);padding:19px 0"><b>${esc(c.title)}</b><p class="smallprint">${completed(c)}/${c.units.length} teoriaosiota · Paras koe ${data.exams[c.id]===undefined?'ei suoritettu':data.exams[c.id]+'%'}</p>${progressBar(completion(c))}<button class="btn btn-muted btn-small" style="margin-top:12px" data-go="/kurssi/${c.id}/0">Avaa →</button></div>`).join('')}<p class="smallprint">Tiedot voidaan menettää selaintietoja poistettaessa. Niitä ei siirretä toiselle laitteelle.</p><button id="resetAll" class="btn btn-muted">Poista suoritustiedot</button></div></section>`;$('#resetAll').addEventListener('click',()=>{if(confirm('Poistetaanko kaikki tämän selaimen Valmiro-suoritukset?')){data=empty();save();progressScreen()}})}

function instructorScreen(){root.innerHTML=head('KOULUTTAJAKESKUS','Harjoitusten suunnittelu ja materiaalit','Ladattavia materiaaleja ja tulostettavia pohjia kouluttajille.')+`<section class="section shell"><div class="eyebrow">LADATTAVAT MATERIAALIT</div><h2 class="section-heading">PDF-kirjasto</h2><p class="lead">Lisää PDF-tiedostot GitHubin <code>materiaalit</code>-kansioon, jolloin painikkeet toimivat.</p>${DOCUMENTS.map(([title,desc,file])=>`<div class="doc"><div class="doc-mark">PDF</div><div class="doc-text"><h3>${esc(title)}</h3><p>${esc(desc)}</p></div><a href="materiaalit/${file}" class="btn btn-red" download>Lataa PDF ↓</a></div>`).join('')}<h2 class="section-heading" style="margin-top:55px">Tulostettavat kouluttajapohjat</h2><p class="lead">Pohjat muodostetaan selaimessa ilman kirjautumista. Valitse tulostusikkunassa ”Tallenna PDF-tiedostona”, jos haluat PDF:n.</p>${[['plan','Harjoitussuunnitelma','Tavoite, välineet, riskit, aikataulu ja arviointi'],['cards','Tilannekortit','Kuusi kuvitteellista tilannekorttia viestiliikenteeseen'],['score','Arviointilomake','Osallistujan osaamisen havainnointi ilman henkilötietoja']].map(([id,name,desc])=>`<div class="doc"><div class="doc-mark">A4</div><div class="doc-text"><h3>${esc(name)}</h3><p>${esc(desc)}</p></div><button class="btn btn-muted" data-print="${id}">Tulosta / PDF →</button></div>`).join('')}<div class="callout"><b>Ennen käyttöä</b><p>Kaikki materiaalit ovat itsenäisen projektin luonnoksia. Tarkistuta tekniset ja turvallisuuteen liittyvät sisällöt oman palokunnan kouluttajalla. Tämä ei ole virallinen koulutusmateriaali.</p></div></section>`;$$('[data-print]').forEach(b=>b.addEventListener('click',()=>printMaterial(b.dataset.print)))}
function printMaterial(kind){const templates={
plan:[['Harjoituksen perustiedot','Aihe: ______________________________','Kohderyhmä ja osaamistaso: ______________________________','Tavoite: ______________________________'],['Turvallisuussuunnitelma','Harjoitusalue ja rajat: ______________________________','Keskeiset vaaratekijät: ______________________________','Riskien hallintatoimet: ______________________________','Vastuuhenkilö ja keskeytyskäytäntö: ______________________________'],['Toteutus ja arviointi','Aloitus ja ohjeistus: ______________________________','Harjoitusvaiheet: ______________________________','Palaute ja havainnot: ______________________________','Seuraavan kerran kehitystoimi: ______________________________']],
cards:[['Tilannekortti 1 · Epäselvä sijainti','Harjoitusjohto ilmoittaa rakennustunnuksen, mutta viimeinen kirjain ei kuulu.','Tehtävä: muodosta tarkentava viesti ja kerro, miten varmistat tiedon.'],['Tilannekortti 2 · Lähetys ei onnistu','Harjoitusradio ei anna lähetyslupaa.','Tehtävä: kuvaa turvalliset tarkistukset ja keneltä pyydät apua.'],['Tilannekortti 3 · Korjattu ohje','Uusi ilmoitus korvaa aiemman kokoontumisajan.','Tehtävä: kerro muutos niin, että vastaanottaja ymmärtää korjauksen.'],['Tilannekortti 4 · Ristiriitainen tieto','Kaksi ryhmää on matkalla eri paikkoihin saman tehtävän vuoksi.','Tehtävä: ilmoita ristiriita kouluttajalle.'],['Tilannekortti 5 · Kuittauksen merkitys','Vastaanottaja kuittaa viestin muttei vahvista tehtävän valmistumista.','Tehtävä: erottele vastaanotto ja tehtävän suoritus.'],['Tilannekortti 6 · Jälkipalaute','Keskustelussa oli useita epäselvyyksiä.','Tehtävä: kerro kaksi havaintoa ja yksi parannuskeino.']],
score:[['Havainnointilomake','Harjoituksen aihe: ______________________________','Arvioija: ______________________________','Päivämäärä: ______________________________'],['Arvioi havaintoihin perustuen','Viestin selkeys (1–4): ____','Kuunteleminen ja tarkentaminen (1–4): ____','Turvallisuusohjeiden noudattaminen (1–4): ____','Yhteistyö (1–4): ____'],['Palaute','Hyvin onnistui: ______________________________','Kehitettävää: ______________________________','Seuraava harjoitustavoite: ______________________________']]
};const items=templates[kind]||templates.plan;$('#printArea').innerHTML=items.map((item,i)=>`<section><h1>VALMIRO <small style="font-size:11pt">KOULUTTAJAMATERIAALI</small></h1><h2>${esc(item[0])}</h2>${item.slice(1).map(x=>`<p>${esc(x)}</p><div class="line"></div>`).join('')}<p style="margin-top:45px;font-size:9pt">Itsenäinen harjoitusmateriaali. Tarkista sopivuus paikallisiin ohjeisiin.</p></section>`).join('');window.print()}
function aboutScreen(){root.innerHTML=head('TIETOA VALMIROSTA','Oppimista palokuntanuorille','Itsenäinen projekti täydentämään ohjattua harrastustoimintaa.')+`<section class="section shell about-cols"><article class="panel"><div class="eyebrow">MIKSI VALMIRO?</div><h2>Harjoitusten välissäkin voi oppia.</h2><p>Valmiro kokoaa palokuntanuorille suunnattuja teoriaosuuksia, harjoituskokeita ja päätöksentekoa kehittäviä kuvitteellisia tilanteita. Tarkoitus on auttaa oppijaa valmistautumaan ohjattuihin harjoituksiin – ei korvata niitä.</p><h3>Miten sisältöjä käytetään?</h3><p>Valitse kurssi, lue osiot ja pohdi soveltavia tehtäviä. Lopuksi voit suorittaa verkkokokeen. Kouluttajalle-osiosta löytyy tulostettavia harjoitussuunnitelmia ja PDF-paketteja.</p><h3>Turvallisuus ja vastuu</h3><p>Valmiro ei ole pelastuslaitos, viranomainen, oppilaitos eikä virallinen pätevyyksiä myöntävä palvelu. Käytännön kalusto-, palo- ja ensiapuharjoitukset tehdään vain asianmukaisesti valvottuina.</p><h3>Tietosuoja</h3><p>Sivusto ei pyydä kirjautumista, nimiä tai sähköpostiosoitteita. Opiskelun eteneminen tallennetaan vain paikallisesti selaimeen. Hosting-palveluntarjoaja voi käsitellä teknisiä yhteystietoja.</p><p class="smallprint">Ylläpitäjälle: ennen laajaa julkista käyttöä lisää tosiasialliset yhteys- ja ylläpitotiedot sekä tarkista tietosuojakuvaus.</p></article><aside class="panel"><div class="eyebrow">TARKISTETTAVAA AINEISTOA</div><h3>Luotettavat lähteet</h3><p><a href="https://www.punainenristi.fi/ensiapu/ensiapuohjeet/" target="_blank" rel="noopener noreferrer">Suomen Punainen Risti – ensiapuohjeet</a></p><p><a href="https://www.suomi.fi/kansalaiselle/turvallisuus/hatatilanteet-ja-turvallisuus/opas/nain-toimit-hatatilanteissa/hatatilanteessa-soita-112" target="_blank" rel="noopener noreferrer">Suomi.fi – soittaminen 112:een</a></p><p><a href="https://www.spek.fi/" target="_blank" rel="noopener noreferrer">Suomen Pelastusalan Keskusjärjestö</a></p><p class="smallprint">Kurssit ovat projektin laatimaa harjoitussisältöä; linkit ovat jatkolukemista eivätkä tarkoita virallista hyväksyntää.</p><div class="glow-strip"></div><h3 style="margin-top:25px">Avoin oppimisympäristö</h3><p>Ei pakollista maksua, käyttäjätilejä tai etäpalvelimelle tallennettuja koetuloksia.</p><button class="btn btn-red" data-go="/kurssit">Siirry kursseihin →</button></aside></section>`}
