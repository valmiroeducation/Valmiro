step('Kirjallinen ohjelma ohjaa rakennukseen C. Radioilmoitus kuulostaa rakennukselta G.',['Valitsen radion, koska uusi tieto on yleensä ajantasaisempi.','Ilmoitan ristiriidan ja varmistan määränpään kouluttajalta.','Noudatan kirjallista ohjetta ja mainitsen epävarmuuden vasta perillä.'],1,'Ristiriita tulee varmistaa ennen toimintaa.'),
step('Kouluttaja toistaa ohjeen, mutta rakennuksen kirjain ei vieläkään erotu.',['Pyydän toistamaan nimenomaan rakennustunnuksen.','Kysyn toista ryhmää arvaamaan, mikä kirjain kuului.','Pyydän koko harjoitusohjelman lähettämistä alusta.'],0,'Tarkenna puuttuva ydintieto ilman tarpeetonta liikennettä.'),
step('Vahvistukseksi saadaan C. Toinen ryhmä on jo lähtenyt G:hen.',['En puutu asiaan, koska toinen ryhmä vastaa itsestään.','Käsken toista ryhmää kääntymään omin päin.','Ilmoitan ristiriidasta kouluttajalle ja varmistan tiedon välitystavan.'],2,'Tehtäviä koskevat muutokset tehdään harjoituksen ohjauksessa.'),
step('Seuraava ilmoitus muuttaa aloitusaikaa. Paikkaa ei mainita.',['Kerron vain uuden ajan ja oletan paikan pysyvän.','Tarkennan, koskeeko muutos vain aikaa vai myös paikkaa.','Pyydän ryhmää odottamaan jokaisen uuden ilmoituksen jälkeen 15 minuuttia.'],1,'Muuttuvan tiedon rajaus ehkäisee väärintulkintoja.'),
step('Harjoitusradio ei saa lähetyslupaa juuri, kun tarvitset vahvistuksen.',['Toimin laiteohjeen mukaan ja pyydän tarvittaessa kouluttajan apua.','Pidän lähetyspainiketta pohjassa, kunnes yhteys varmasti aukeaa.','Siirryn itse etsimään satunnaista toimivaa puheryhmää.'],0,'Laitteen ilmoituksia ja sovittua menettelyä noudatetaan.'),
step('Rastin lopuksi kouluttaja pyytää palautteen viestiliikenteestä.',['Kerron vain, että pääsimme lopulta paikalle.','Keskityn siihen, kuka puhui huonoimmin.','Kuvaan ristiriidat, varmistustavan ja kehitysehdotuksen.'],2,'Hyvä palaute kuvaa havaintoja ja korjaavia toimia.')]),
scenario('sadeharjoitus','Turvallisuus muuttuvissa oloissa','Turvallisuus','Nuorten harjoituspäivä pidetään ulkoalueella. Sää muuttuu ja harjoitusvälineistössä havaitaan puutteita.',[
step('Harjoitusrastin kulkuväylä muuttuu märäksi ja liukkaaksi.',['Jatkan mutta pyydän jokaista kävelemään hitaammin.','Kerron riskistä vastuuhenkilölle ennen suorituksen jatkamista.','Vaihdan ryhmän reittiä ilman yhteistä ohjetta.'],1,'Olosuhteen muutos edellyttää riskiarvion tarkistamista.'),
step('Huomaat kuormaa kantavassa harjoitusvälineessä poikkeavan vaurion.',['Kokeilen, kestääkö väline vielä kevyen kuorman.','Annan kokeneimman nuoren arvioida sen nopeasti.','Poistan sen käytöstä ja ilmoitan kouluttajalle.'],2,'Vaurioitunutta kalustoa ei kokeilla vaarallisesti.'),
step('Ulkopuolinen tulee rajatulle alueelle.',['Pysäytän vaarantuvan toiminnan ja ilmoitan vastuuhenkilölle.','Pyydän häntä vilkaisemaan nopeasti ja jatkan.','Annan toiselle nuorelle tehtäväksi siirtää hänet.'],0,'Alueen turvallisuus kuuluu vastuuhenkilön hallintaan.'),
step('Yksi osallistuja kertoo huonosta olosta mutta haluaisi jatkaa.',['Annan hänen jatkaa, koska hän itse haluaa.','Keskeytän hänen osuutensa ja pyydän kouluttajan arvioon.','Ehdotan seuraavan rastin vaihtamista kevyemmäksi kertomatta muille.'],1,'Voimavaroja ja terveyttä koskeva huoli otetaan vakavasti.'),
step('Harjoituksen aikataulu alkaa myöhästyä.',['Nopeutamme suorituksia poistamalla tarkistuksia.','Jatkamme vaurioituneella välineellä vain kerran.','Pidämme turvallisuusvaatimukset ennallaan ja sovitamme aikataulun.'],2,'Aikataulu ei oikeuta kasvattamaan riskiä.'),
step('Päivä päättyy ilman vammoja mutta useita läheltä piti -havaintoja on tehty.',['Kirjataan havainnot ja suunnitellaan korjaavat toimet.','Päätetään ettei mitään ole tarpeen käsitellä.','Poistetaan havaintolista, jottei harjoituksen onnistuminen näytä huonolta.'],0,'Läheltä piti -tiedot ovat arvokasta turvallisuustietoa.')]),
scenario('yleisotilanne','Avuntarve yleisötapahtumassa','Ensiapu','Osallistut tapahtumaan tavallisena kävijänä. Huomaat henkilön mahdollisen avuntarpeen ja tilanteessa on muita sivullisia.',[
step('Henkilö kaatuu lähellä vilkasta kulkuväylää.',['Siirrän henkilön heti sivuun.','Arvioin ensin paikan turvallisuuden ja avuntarpeen.','Jään odottamaan, että joku muu lähestyy.'],1,'Auttajan ja autettavan turvallisuus on ensisijaista.'),
step('Henkilö ei reagoi puhutteluun.',['Seuraan vielä muutaman minuutin muutosta.','Pyydän omaisia paikalle ennen muuta toimintaa.','Hälytän kiireellistä apua 112:sta ja toimin päivystäjän ohjeilla.'],2,'Reagoimattomuus on vakavan hätätilanteen merkki.'),
step('Päivystäjä pyytää tarkkaa osoitetta, jota et tiedä.',['Kerron maamerkit ja käytettävissä olevan sijaintitiedon.','Arvaan lähimmän osoitteen varmana.','Kerron vain tapahtuman nimen.'],0,'Paikkatiedon epävarmuus sanotaan suoraan.'),
step('Autettavan vointi muuttuu kesken puhelun.',['Jatkan aiemman tilanteen kuvaamista, ettei viesti katkea.','Kerron muutoksen päivystäjälle heti.','Pyydän toista sivullista tekemään uuden puhelun ilman lisätietoja.'],1,'Ajantasainen tieto auttaa tilanteen arvioinnissa.'),
step('Paikalla oleva sivullinen alkaa kuvata autettavaa läheltä.',['Keskityn vain kuvaajaan ja lopetan yhteyden päivystäjään.','Julkaisen itse kuvan tiedoksi muille.','Pyydän tilanteeseen sopivasti turvaamaan yksityisyyttä ja jatkan auttamista.'],2,'Yksityisyyden huomiointi ei saa viivyttää kiireellistä apua.'),
step('Ammattiapu saapuu ja kysyy tapahtumista.',['Kerron omat havaintoni, muutokset ja tehdyt toimet.','Kerron varmana oman diagnoosiarvioni.','Oletan heidän tietävän kaiken hätäkeskuksesta.'],0,'Havainnot ja toimet täydentävät tilannekuvaa.')]),
scenario('evakuointi','Rakennuksen poistumisharjoitus','Poistuminen','Koulutusryhmä järjestää ohjatun poistumisharjoituksen. Harjoituksen aikana ilmenee epäselvyyksiä reiteissä ja osallistujien laskennassa.',[
step('Uudessa rakennuksessa on kaksi opastettua poistumistietä.',['Valitsen nopeimman ilman rakennuksen ohjeita.','Tutustun ohjeisiin ja käytettävissä oleviin turvallisiin reitteihin.','Annan jokaisen valita mieluisimman reitin.'],1,'Rakennuksen järjestelyihin tutustutaan ennen harjoitusta.'),
step('Yksi reitti on tilapäisesti estetty.',['Käytän sitä, koska opaste osoittaa siihen.','Siirrän esteen omin päin tietämättä syytä.','Ilmoitan tilanteesta kouluttajalle ja noudatan turvallista vaihtoehtoista ohjetta.'],2,'Poistumisreitiltä havaittu este täytyy käsitellä.'),
step('Ryhmän nuori tarvitsee apua portaissa.',['Pyydän vastuuhenkilöltä sovittua avustusmenettelyä.','Lähden itse siirtämään häntä, vaikka en tiedä miten.','Jätän hänet portaisiin ja poistun kertomatta asiasta.'],0,'Avustaminen suunnitellaan turvallisesti ja vastuullisesti.'),
step('Kokoontumisessa yhden osallistujan sijainti ei ole tiedossa.',['Merkitsen hänen olleen mukana, jos näin hänet aiemmin.','Kerron puuttuvasta tiedosta vastuuhenkilölle heti.','Lähden yksin etsimään rakennuksesta.'],1,'Puuttuva henkilö on tärkeä tilannetieto.'),
step('Kokoontumispaikalle tulee uusi turvallisuutta heikentävä este.',['Pidän ryhmän samalla paikalla, koska paikka on ennalta määrätty.','Annan jokaisen siirtyä itsenäisesti.','Ilmoitan havainnon ja noudatan sovittua turvallista vaihtoehtoa.'],2,'Turvallisuusarvio jatkuu myös poistumisen jälkeen.'),
step('Kouluttaja pyytää loppuarvion.',['Kuvaan ohjeiden selkeyden, esteen, avustamisen ja laskennan.','Ilmoitan vain suorituksen kokonaisajan.','Sanon harjoituksen onnistuneen, koska mitään ei sattunut.'],0,'Poistumisen onnistuminen on muutakin kuin ajankäyttö.')]),
scenario('kalustopaiva','Kalustorastin poikkeama','Kalusto','Valmistelet yhdessä kouluttajan kanssa nuorille kalustotuntemusrastia. Käytössä on harjoitukseen soveltuvia välineitä.',[
step('Yksi väline näyttää samanlaiselta kuin tuttu väline mutta mallimerkintä poikkeaa.',['Käytän sitä samoilla ohjeilla ulkonäön perusteella.','Varmistan käyttötarkoituksen ja ohjeen ennen käyttöä.','Annan osallistujan kokeilla eroa.'],1,'Saman näköiset välineet voivat erota rajoituksiltaan.'),
step('Välineen osa liikkuu poikkeavasti.',['Kirjaan havainnon vasta rastin jälkeen.','Pienennän käyttökuormaa omin päin.','Keskeytän käytön ja pyydän asianmukaisen tarkastuksen.'],2,'Poikkeavaa välinettä ei käytetä ilman arviota.'),
step('Osallistuja ehdottaa välineen korjaamista heti itse.',['Selitän, että korjaus ja käyttöönoton arvio kuuluvat valtuutetulle henkilölle.','Annan hänen kokeilla, jos työkalut löytyvät.','Ohitan asian, jos suoritukseen on vähän aikaa.'],0,'Korjaamisen vastuu ja osaaminen pitää tunnistaa.'),
step('Varaston kulkuväylälle kertyy useita välineitä.',['Jätän ne, koska ne näkyvät selvästi.','Järjestän kouluttajan kanssa välineet turvallisiin paikkoihin.','Pyydän osallistujia hyppäämään esteiden yli.'],1,'Selkeä kulkuympäristö vähentää kompastumisriskejä.'),
step('Rastin loppuun tulee uusi nuori, joka ei saanut turvallisuusohjetta.',['Annan hänen seurata muiden mallia.','Pyydän paria kertomaan ohjeet epävirallisesti.','Annan tai järjestän tarvittavan perehdytyksen ennen osallistumista.'],2,'Perehdytystä ei korvata matkimisella.'),
step('Harjoitus päättyy. Mikä on paras loppuarvio?',['Arvioin tunnistamista, turvallista käsittelyä ja tilanteita, joissa käyttö keskeytettiin.','Lasken vain kuinka monta välinettä nimettiin oikein.','Arvioin vain osanottajien nopeutta.'],0,'Kalustotuntemus sisältää myös turvallisen päätöksenteon.')])
];

const STORAGE='valmiro_v4';
const empty=()=>({units:{},exams:{},scenes:{}});
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE));return x&&typeof x==='object'?{units:x.units||{},exams:x.exams||{},scenes:x.scenes||{}}:empty()}catch{return empty()}}
let data=load();
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch{/* yksityinen tila voi estää tallennuksen */}}
const courseBy=id=>COURSES.find(x=>x.id===id);
const sceneBy=id=>SCENARIOS.find(x=>x.id===id);
const completed=c=>(data.units[c.id]||[]).filter(x=>Number.isInteger(x)&&x>=0&&x<c.units.length).length;
const passed=c=>(data.exams[c.id]??-1)>=80;
const completion=c=>Math.round(100*(completed(c)+(passed(c)?1:0))/(c.units.length+1));
let catalogCategory='Kaikki',catalogSearch='';
let examSession=null,sceneSession=null;
let previousMenuFocus=null;
const root=$('#main');
function toggleMenu(open){const menu=$('#drawer'),btn=$('#menuToggle');if(open)previousMenuFocus=document.activeElement;menu.classList.toggle('open',open);menu.inert=!open;$('#scrim').hidden=!open;btn.setAttribute('aria-expanded',String(open));document.body.style.overflow=open?'hidden':'';if(open)$('#menuClose').focus();else if(previousMenuFocus&&typeof previousMenuFocus.focus==='function')previousMenuFocus.focus()}
$('#menuToggle').addEventListener('click',()=>toggleMenu(!$('#drawer').classList.contains('open')));
$('#menuClose').addEventListener('click',()=>toggleMenu(false));
$('#scrim').addEventListener('click',()=>toggleMenu(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#drawer').classList.contains('open'))toggleMenu(false)});
// delegated nav, toimii myös sisältöä uudelleen renderöitäessä
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;const path=b.getAttribute('data-go');if(path)go(path)});
function go(path){toggleMenu(false);if(location.hash!==`#${path}`)location.hash=path;else route()}
window.addEventListener('hashchange',route);
function route(){let path=decodeURIComponent(location.hash.slice(1)||'/').replace(/\/+$/,'')||'/';const p=path.split('/').filter(Boolean);if(!p.length)home();else if(p[0]==='kurssit'&&!p[1])catalog();else if(p[0]==='kurssi'&&courseBy(p[1]))courseScreen(p[1],p[2]||'0');else if(p[0]==='tilanteet'&&!p[1])scenariosScreen();else if(p[0]==='tilanne'&&sceneBy(p[1]))sceneScreen(p[1]);else if(p[0]==='oma')progressScreen();else if(p[0]==='kouluttajalle')instructorScreen();else if(p[0]==='tietoa')aboutScreen();else home();window.scrollTo({top:0,behavior:'instant'});document.title='Valmiro | '+(p[0]||'Etusivu');}
const tag=x=>`<span class="chip">${esc(x)}</span>`;
const progressBar=p=>`<div class="bar" aria-label="${p}% suoritettu"><span style="width:${p}%"></span></div>`;
const head=(eyebrow,title,description)=>`<div class="page-head"><div class="shell"><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p>${esc(description)}</p></div></div>`;
function card(c){const p=completion(c);return `<article class="course-card"><div class="card-banner"><strong>${esc(c.code)}</strong><small>VALMIRO / ${esc(c.group.toUpperCase())}</small></div><div class="card-body">${tag(passed(c)?'KURSSI HYVÄKSYTTY':'OPPIMISKOKONAISUUS')}<h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p><div class="card-meta"><span>${c.units.length} teoriaosiota</span><span>${c.quiz.length} koekysymystä</span><span>Oma tahti</span></div>${progressBar(p)}<div class="card-foot"><small>${p}% suoritettu</small><button data-go="/kurssi/${c.id}/0">${p?'Jatka':'Aloita'} →</button></div></div></article>`}
function home(){root.innerHTML=`<section class="hero"><div class="shell hero-inner">

  </button>

   <span class="hero-stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20v-9m-3 3 3-3 3 3"/><circle cx="12" cy="5" r="2"/><path d="M6.8 8.7a7.5 7.5 0 0 0 0 10.6m10.4-10.6a7.5 7.5 0 0 1 0 10.6"/></svg></span>

  </div>
 </aside>
 </div><svg class="wave" viewBox="0 0 850 500" aria-hidden="true" preserveAspectRatio="none"><path d="M0 480 C160 180 275 490 450 155 S750 60 850 250"/><path d="M-20 520 C160 110 290 420 470 200 S690 100 880 45"/><path d="M10 410 C190 350 305 100 500 260 S720 490 900 140"/></svg><div class="ember" aria-hidden="true"></div></section><div class="glow-strip"></div>
<section class="section shell"><div class="eyebrow">OPPIMISPOLUT</div><h2 class="section-heading">Opiskele turvallisesti, etene omaan tahtiin.</h2><p class="lead">Kurssit sisältävät teoriaa, pohdintatehtäviä sekä soveltavan loppukokeen.</p><div class="card-grid" style="margin-top:32px">${COURSES.slice(0,6).map(card).join('')}</div><p style="margin-top:26px"><button class="btn btn-muted" data-go="/kurssit">Näytä kaikki ${COURSES.length} kurssia →</button></p></section><section class="section" style="background:#0d1928"><div class="shell"><div class="eyebrow">KOULUTTAJILLE</div><h2 class="section-heading">Harjoitusmateriaaleja myös rastien vetäjille.</h2><p class="lead">Selaimessa muokattavat harjoitussuunnitelmat, tilannekortit ja tulostettavat palautelomakkeet.</p><button class="btn btn-red" data-go="/kouluttajalle">Avaa kouluttajakeskus →</button></div></section>`}
function catalog(){const cats=['Kaikki',...new Set(COURSES.map(c=>c.group))];const matching=COURSES.filter(c=>(catalogCategory==='Kaikki'||c.group===catalogCategory)&&[c.title,c.summary,c.group].join(' ').toLowerCase().includes(catalogSearch.toLowerCase()));root.innerHTML=head('KURSSIKIRJASTO','Kaikki koulutukset','Valitse kiinnostava aihe. Kurssin eteneminen tallentuu omaan selaimeesi.')+`<section class="section shell"><div class="inline-search"><input class="search-input" id="catalogSearch" type="search" placeholder="Hae koulutuksia…" value="${esc(catalogSearch)}" aria-label="Hae koulutuksia"></div><div class="pills" id="catPills">${cats.map(c=>`<button data-cat="${esc(c)}" class="${catalogCategory===c?'selected':''}">${esc(c)}</button>`).join('')}</div><p class="smallprint">Sisältöjen opiskeluaika riippuu siitä, kuinka perusteellisesti perehdyt teoriaan ja sovellat sitä tehtävissä.</p><div class="card-grid" id="courseResults" style="margin-top:25px">${matching.map(card).join('')||'<p>Ei hakua vastaavia koulutuksia.</p>'}</div></section>`;$('#catalogSearch').addEventListener('input',e=>{catalogSearch=e.target.value;const rows=COURSES.filter(c=>(catalogCategory==='Kaikki'||c.group===catalogCategory)&&[c.title,c.summary,c.group].join(' ').toLowerCase().includes(catalogSearch.toLowerCase()));$('#courseResults').innerHTML=rows.map(card).join('')||'<p>Ei hakua vastaavia koulutuksia.</p>'});$$('[data-cat]').forEach(b=>b.addEventListener('click',()=>{catalogCategory=b.dataset.cat;catalog()}));}
function courseScreen(id,unitIndex){const c=courseBy(id);if(!c)return;const i=unitIndex==='koe'?c.units.length:Math.max(0,Math.min(c.units.length,Number(unitIndex)||0));root.innerHTML=head(`KOULUTUS / ${c.group.toUpperCase()}`,c.title,c.summary)+`<section class="section shell"><div class="reader-layout"><nav class="panel lesson-nav" aria-label="Kurssin osiot"><h3>Kurssin sisältö</h3>${c.units.map((u,n)=>`<button data-go="/kurssi/${id}/${n}" class="${i===n?'active':''}"><b>${(data.units[id]||[]).includes(n)?'✓':String(n+1).padStart(2,'0')}</b> ${esc(u.title)}</button>`).join('')}<button class="${i===c.units.length?'active':''}" data-go="/kurssi/${id}/koe"><b>EX</b> Loppukoe (${c.quiz.length} kysymystä)</button><div class="mini-progress">Eteneminen ${completion(c)}%${progressBar(completion(c))}</div></nav><article class="panel lesson-main" id="lessonMain"></article></div></section>`;if(i===c.units.length)examScreen(c);else lessonScreen(c,i)}
function lessonScreen(c,i){const u=c.units[i],done=(data.units[c.id]||[]).includes(i);$('#lessonMain').innerHTML=`<div class="lesson-topline"><span class="eyebrow">TEORIAOSIO ${i+1} / ${c.units.length}</span><span>Valmiro Learning</span></div><div class="theory-text"><h2>${esc(u.title)}</h2><p class="lead">${esc(u.lead)}</p>${u.sections.map(([heading,body])=>`<h3>${esc(heading)}</h3><p>${esc(body)}</p>`).join('')}<div class="callout"><b>Soveltava pohdinta</b><p>${esc(u.task)}</p><small>Kirjoita vastaus halutessasi omiin muistiinpanoihin. Tätä tehtävää ei tallenneta sivustolle.</small></div><div class="lesson-actions"><button class="btn btn-red" id="markUnit">${done?'Siirry seuraavaan →':'Merkitse opiskelluksi ja jatka →'}</button>${i>0?`<button class="btn btn-muted" data-go="/kurssi/${c.id}/${i-1}">← Edellinen</button>`:''}</div></div>`;$('#markUnit').addEventListener('click',()=>{const arr=data.units[c.id]||[];if(!arr.includes(i))arr.push(i);data.units[c.id]=arr;save();go(`/kurssi/${c.id}/${i===c.units.length-1?'koe':i+1}`)});}
function shuffled(n){const a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function examScreen(c){if(!examSession||examSession.id!==c.id)makeExam(c);const s=examSession;$('#lessonMain').innerHTML=`<div class="eyebrow">Loppukoe</div><h2>${esc(c.title)}</h2><div class="callout">${c.quiz.length} kysymystä · Läpäisyraja 80 % · Kysymysten ja vastausten järjestys vaihtuu uusintayrityksellä. <b>Valitse paras vastaus</b>, vaikka muutkin vaikuttaisivat mahdollisilta.</div><div id="questions">${s.order.map((qidx,i)=>{const qq=c.quiz[qidx];return `<fieldset class="quiz-question" style="border:0;padding-left:0;padding-right:0"><legend><h3>${i+1}. ${esc(qq.title)}</h3></legend>${s.options[i].map(optIdx=>`<label class="choice" data-q="${i}" data-o="${optIdx}"><input type="radio" name="q${i}" value="${optIdx}"><span>${esc(qq.options[optIdx])}</span></label>`).join('')}</fieldset>`}).join('')}</div><div id="examResult" aria-live="polite"></div><div class="lesson-actions"><button class="btn btn-red" id="gradeExam">Tarkista vastaukset</button><button class="btn btn-muted" id="restartExam">Uusi koeyritys</button></div>`;$('#gradeExam').addEventListener('click',()=>gradeExam(c));$('#restartExam').addEventListener('click',()=>{makeExam(c);examScreen(c)})}
function makeExam(c){examSession={id:c.id,order:shuffled(c.quiz.length),options:Array.from({length:c.quiz.length},()=>shuffled(4))}}
function gradeExam(c){const selections=examSession.order.map((_,i)=>$(`input[name=q${i}]:checked`)?.value);if(selections.some(x=>x===undefined)){$('#examResult').innerHTML='<div class="callout">Vastaa jokaiseen kysymykseen ennen tarkistamista.</div>';return}let n=0;const results=[];examSession.order.forEach((qidx,i)=>{const qq=c.quiz[qidx],selected=Number(selections[i]),ok=selected===qq.correct;if(ok)n++;$$(`[data-q="${i}"]`).forEach(el=>{const opt=Number(el.dataset.o);if(opt===qq.correct)el.classList.add('good');if(opt===selected&&!ok)el.classList.add('bad')});results.push(`<p><b>${i+1}. ${ok?'Oikein':'Väärin'}</b> – ${esc(qq.why)}</p>`)});const score=Math.round(100*n/c.quiz.length);data.exams[c.id]=Math.max(data.exams[c.id]??0,score);save();$$('#questions input').forEach(x=>x.disabled=true);$('#gradeExam').disabled=true;$('#examResult').innerHTML=`<div class="result ${score<80?'fail':''}" role="status"><div class="eyebrow">${score>=80?'HARJOITUS HYVÄKSYTTY':'KERTAA JA YRITÄ UUDELLEEN'}</div><h2>${score}% – ${n}/${c.quiz.length} oikein</h2><p>Kyseessä on Valmiron verkkokoe. Näet perustelut vastauksillesi alla.</p><h3>Vastausten perustelut</h3>${results.join('')}</div>`;$('#examResult').scrollIntoView({behavior:'smooth',block:'nearest'})}
function scenariosScreen(){root.innerHTML=head('TILANNEHARJOITUKSET','Päätöksentekoa muuttuvissa tilanteissa','Harjoittele tietojen tarkistamista, turvallisia valintoja ja havaintojen perustelemista.')+`<section class="section shell"><div class="callout">Kuvitteelliset harjoitukset eivät ole operatiivisia ohjeita. Käytännössä noudatetaan aina vastuuhenkilön tai hätäkeskuksen ohjeita.</div><div class="card-grid">${SCENARIOS.map((s,i)=>`<article class="course-card"><div class="card-banner"><strong>${String(i+1).padStart(2,'0')}</strong><small>${esc(s.category.toUpperCase())}</small></div><div class="card-body">${tag('6 PÄÄTÖSVAIHETTA')}<h3>${esc(s.title)}</h3><p>${esc(s.intro)}</p><div class="card-foot"><small>${data.scenes[s.id]===undefined?'Ei suoritettu':'Paras tulos '+data.scenes[s.id]+'%'}</small><button data-go="/tilanne/${s.id}">Aloita →</button></div></div></article>`).join('')}</div></section>`}
function sceneScreen(id){const s=sceneBy(id);if(!s)return;if(!sceneSession||sceneSession.id!==id)sceneSession={id,index:0,points:0,answered:false};const st=sceneSession;root.innerHTML=head('HARJOITUS / '+s.category.toUpperCase(),s.title,s.intro)+`<section class="section shell"><div class="panel scenario-screen" id="sceneArea"></div></section>`;drawScene(s)}
function drawScene(s){const st=sceneSession,area=$('#sceneArea');if(st.index>=s.steps.length){const score=Math.round(st.points/s.steps.length*100);data.scenes[s.id]=Math.max(data.scenes[s.id]??0,score);save();area.innerHTML=`<span class="chip green">HARJOITUS PÄÄTTYNYT</span><h2>${esc(s.title)}</h2><h3>${st.points}/${s.steps.length} perusteltua valintaa · ${score}%</h3><p class="lead">Harjoitus mittaa tämän kuvitteellisen tilanteen valintoja, ei todellista toimintakelpoisuutta.</p><div class="lesson-actions"><button class="btn btn-red" id="restartScene">Harjoittele uudelleen</button><button class="btn btn-muted" data-go="/tilanteet">Kaikki harjoitukset</button></div>`;$('#restartScene').addEventListener('click',()=>{sceneSession={id:s.id,index:0,points:0,answered:false};drawScene(s)});return}const stepData=s.steps[st.index];area.innerHTML=`<div class="scenario-context"><div class="eyebrow">HARJOITUSVAIHE ${st.index+1} / ${s.steps.length}</div><h2>${esc(s.title)}</h2><p>${esc(s.intro)}</p>${progressBar(Math.round(st.index/s.steps.length*100))}</div><h2 style="font-size:23px;line-height:1.4">${esc(stepData.s)}</h2><p class="lead">Valitse mielestäsi perustelluin toimintatapa.</p>${stepData.opts.map((text,i)=>`<button class="scene-choice" data-sceneopt="${i}"><b>${'ABC'[i]}.</b> ${esc(text)}</button>`).join('')}<div id="sceneFeedback" aria-live="polite"></div>`;$$('[data-sceneopt]').forEach(b=>b.addEventListener('click',()=>{if(st.answered)return;st.answered=true;const pick=Number(b.dataset.sceneopt),good=pick===stepData.correct;if(good)st.points++;$$('[data-sceneopt]').forEach(x=>x.disabled=true);$('#sceneFeedback').innerHTML=`<div class="scene-feedback ${good?'':'bad'}"><b>${good?'Perusteltu ratkaisu':'Valintaan liittyy ongelma'}</b><p>${esc(stepData.feedback)}</p></div><button id="nextScene" class="btn btn-red">${st.index===s.steps.length-1?'Näytä yhteenveto':'Jatka seuraavaan →'}</button>`;$('#nextScene').addEventListener('click',()=>{st.index++;st.answered=false;drawScene(s);window.scrollTo({top:0,behavior:'smooth'})})}))}
function progressScreen(){const done=COURSES.filter(passed).length,attempts=COURSES.filter(c=>data.exams[c.id]!==undefined),avg=attempts.length?Math.round(attempts.reduce((a,c)=>a+data.exams[c.id],0)/attempts.length)+'%':'–';root.innerHTML=head('OMA OPPIMINEN','Edistymisen seuranta','Tiedot säilyvät tämän laitteen selaimessa, eivät palvelimella.')+`<section class="section shell"><div class="stat-grid"><div class="stat"><strong>${done}/${COURSES.length}</strong><span>Hyväksyttyä kurssia</span></div><div class="stat"><strong>${avg}</strong><span>Yritettyjen kurssien parhaiden tulosten keskiarvo</span></div><div class="stat"><strong>${Object.keys(data.scenes).length}/${SCENARIOS.length}</strong><span>Harjoiteltua tilannetta</span></div></div><div class="panel" style="margin-top:22px"><h2>Kurssikohtaiset tulokset</h2>${COURSES.map(c=>`<div style="border-top:1px solid var(--line);padding:19px 0"><b>${esc(c.title)}</b><p class="smallprint">${completed(c)}/${c.units.length} teoriaosiota · Paras koe ${data.exams[c.id]===undefined?'ei suoritettu':data.exams[c.id]+'%'}</p>${progressBar(completion(c))}<button class="btn btn-muted btn-small" style="margin-top:12px" data-go="/kurssi/${c.id}/0">Avaa →</button></div>`).join('')}<p class="smallprint">Tiedot voidaan menettää selaintietoja poistettaessa. Niitä ei siirretä toiselle laitteelle.</p><button id="resetAll" class="btn btn-muted">Poista suoritustiedot</button></div></section>`;$('#resetAll').addEventListener('click',()=>{if(confirm('Poistetaanko kaikki tämän selaimen Valmiro-suoritukset?')){data=empty();save();progressScreen()}})}
const DOCUMENTS=[
 ['Viestiliikenteen harjoituspaketti','Harjoitusrakenne, tilannekortit ja arviointitaulukko','valmiro_viestiliikenne.pdf'],

function instructorScreen(){root.innerHTML=head('KOULUTTAJAKESKUS','Harjoitusten suunnittelu ja materiaalit','Ladattavia materiaaleja ja tulostettavia pohjia kouluttajille.')+`<section class="section shell"><div class="eyebrow">LADATTAVAT MATERIAALIT</div><h2 class="section-heading">PDF-kirjasto</h2><p class="lead">Lisää PDF-tiedostot GitHubin <code>materiaalit</code>-kansioon, jolloin painikkeet toimivat.</p>${DOCUMENTS.map(([title,desc,file])=>`<div class="doc"><div class="doc-mark">PDF</div><div class="doc-text"><h3>${esc(title)}</h3><p>${esc(desc)}</p></div><a href="materiaalit/${file}" class="btn btn-red" download>Lataa PDF ↓</a></div>`).join('')}<h2 class="section-heading" style="margin-top:55px">Tulostettavat kouluttajapohjat</h2><p class="lead">Pohjat muodostetaan selaimessa ilman kirjautumista. Valitse tulostusikkunassa ”Tallenna PDF-tiedostona”, jos haluat PDF:n.</p>${[['plan','Harjoitussuunnitelma','Tavoite, välineet, riskit, aikataulu ja arviointi'],['cards','Tilannekortit','Kuusi kuvitteellista tilannekorttia viestiliikenteeseen'],['score','Arviointilomake','Osallistujan osaamisen havainnointi ilman henkilötietoja']].map(([id,name,desc])=>`<div class="doc"><div class="doc-mark">A4</div><div class="doc-text"><h3>${esc(name)}</h3><p>${esc(desc)}</p></div><button class="btn btn-muted" data-print="${id}">Tulosta / PDF →</button></div>`).join('')}<div class="callout"><b>Ennen käyttöä</b><p>Kaikki materiaalit ovat itsenäisen projektin luonnoksia. Tarkistuta tekniset ja turvallisuuteen liittyvät sisällöt oman palokunnan kouluttajalla. Tämä ei ole virallinen koulutusmateriaali.</p></div></section>`;$$('[data-print]').forEach(b=>b.addEventListener('click',()=>printMaterial(b.dataset.print)))}
function printMaterial(kind){const templates={
plan:[['Harjoituksen perustiedot','Aihe: ______________________________','Kohderyhmä ja osaamistaso: ______________________________','Tavoite: ______________________________'],['Turvallisuussuunnitelma','Harjoitusalue ja rajat: ______________________________','Keskeiset vaaratekijät: ______________________________','Riskien hallintatoimet: ______________________________','Vastuuhenkilö ja keskeytyskäytäntö: ______________________________'],['Toteutus ja arviointi','Aloitus ja ohjeistus: ______________________________','Harjoitusvaiheet: ______________________________','Palaute ja havainnot: ______________________________','Seuraavan kerran kehitystoimi: ______________________________']],
cards:[['Tilannekortti 1 · Epäselvä sijainti','Harjoitusjohto ilmoittaa rakennustunnuksen, mutta viimeinen kirjain ei kuulu.','Tehtävä: muodosta tarkentava viesti ja kerro, miten varmistat tiedon.'],['Tilannekortti 2 · Lähetys ei onnistu','Harjoitusradio ei anna lähetyslupaa.','Tehtävä: kuvaa turvalliset tarkistukset ja keneltä pyydät apua.'],['Tilannekortti 3 · Korjattu ohje','Uusi ilmoitus korvaa aiemman kokoontumisajan.','Tehtävä: kerro muutos niin, että vastaanottaja ymmärtää korjauksen.'],['Tilannekortti 4 · Ristiriitainen tieto','Kaksi ryhmää on matkalla eri paikkoihin saman tehtävän vuoksi.','Tehtävä: ilmoita ristiriita kouluttajalle.'],['Tilannekortti 5 · Kuittauksen merkitys','Vastaanottaja kuittaa viestin muttei vahvista tehtävän valmistumista.','Tehtävä: erottele vastaanotto ja tehtävän suoritus.'],['Tilannekortti 6 · Jälkipalaute','Keskustelussa oli useita epäselvyyksiä.','Tehtävä: kerro kaksi havaintoa ja yksi parannuskeino.']],
score:[['Havainnointilomake','Harjoituksen aihe: ______________________________','Arvioija: ______________________________','Päivämäärä: ______________________________'],['Arvioi havaintoihin perustuen','Viestin selkeys (1–4): ____','Kuunteleminen ja tarkentaminen (1–4): ____','Turvallisuusohjeiden noudattaminen (1–4): ____','Yhteistyö (1–4): ____'],['Palaute','Hyvin onnistui: ______________________________','Kehitettävää: ______________________________','Seuraava harjoitustavoite: ______________________________']]
};const items=templates[kind]||templates.plan;$('#printArea').innerHTML=items.map((item,i)=>`<section><h1>VALMIRO <small style="font-size:11pt">KOULUTTAJAMATERIAALI</small></h1><h2>${esc(item[0])}</h2>${item.slice(1).map(x=>`<p>${esc(x)}</p><div class="line"></div>`).join('')}<p style="margin-top:45px;font-size:9pt">Itsenäinen harjoitusmateriaali. Tarkista sopivuus paikallisiin ohjeisiin.</p></section>`).join('');window.print()}
function aboutScreen(){root.innerHTML=head('TIETOA VALMIROSTA','Oppimista palokuntanuorille','Itsenäinen projekti täydentämään ohjattua harrastustoimintaa.')+`<section class="section shell about-cols"><article class="panel"><div class="eyebrow">MIKSI VALMIRO?</div><h2>Harjoitusten välissäkin voi oppia.</h2><p>Valmiro kokoaa palokuntanuorille suunnattuja teoriaosuuksia, harjoituskokeita ja päätöksentekoa kehittäviä kuvitteellisia tilanteita. Tarkoitus on auttaa oppijaa valmistautumaan ohjattuihin harjoituksiin – ei korvata niitä.</p><h3>Miten sisältöjä käytetään?</h3><p>Valitse kurssi, lue osiot ja pohdi soveltavia tehtäviä. Lopuksi voit suorittaa verkkokokeen. Kouluttajalle-osiosta löytyy tulostettavia harjoitussuunnitelmia ja PDF-paketteja.</p><h3>Turvallisuus ja vastuu</h3><p>Valmiro ei ole pelastuslaitos, viranomainen, oppilaitos eikä virallinen pätevyyksiä myöntävä palvelu. Käytännön kalusto-, palo- ja ensiapuharjoitukset tehdään vain asianmukaisesti valvottuina.</p><h3>Tietosuoja</h3><p>Sivusto ei pyydä kirjautumista, nimiä tai sähköpostiosoitteita. Opiskelun eteneminen tallennetaan vain paikallisesti selaimeen. Hosting-palveluntarjoaja voi käsitellä teknisiä yhteystietoja.</p><p class="smallprint">Ylläpitäjälle: ennen laajaa julkista käyttöä lisää tosiasialliset yhteys- ja ylläpitotiedot sekä tarkista tietosuojakuvaus.</p></article><aside class="panel"><div class="eyebrow">TARKISTETTAVAA AINEISTOA</div><h3>Luotettavat lähteet</h3><p><a href="https://www.punainenristi.fi/ensiapu/ensiapuohjeet/" target="_blank" rel="noopener noreferrer">Suomen Punainen Risti – ensiapuohjeet</a></p><p><a href="https://www.suomi.fi/kansalaiselle/turvallisuus/hatatilanteet-ja-turvallisuus/opas/nain-toimit-hatatilanteissa/hatatilanteessa-soita-112" target="_blank" rel="noopener noreferrer">Suomi.fi – soittaminen 112:een</a></p><p><a href="https://www.spek.fi/" target="_blank" rel="noopener noreferrer">Suomen Pelastusalan Keskusjärjestö</a></p><p class="smallprint">Kurssit ovat projektin laatimaa harjoitussisältöä; linkit ovat jatkolukemista eivätkä tarkoita virallista hyväksyntää.</p><div class="glow-strip"></div><h3 style="margin-top:25px">Avoin oppimisympäristö</h3><p>Ei pakollista maksua, käyttäjätilejä tai etäpalvelimelle tallennettuja koetuloksia.</p><button class="btn btn-red" data-go="/kurssit">Siirry kursseihin →</button></aside></section>`}

  area.innerHTML=`<div class="v5-card"><span class="v5-chip">KUVITTEELLINEN AINEISTO</span><div style="margin:18px 0;display:grid;gap:12px">${synthetic.map(y=>`<div class="v5-row"><span style="width:70px">${y.year}</span><div style="flex:1;height:14px;background:#293c51;border-radius:15px;overflow:hidden"><div style="height:100%;width:${Math.round(y.calls/200*100)}%;background:linear-gradient(90deg,#d53c46,#ff858a);border-radius:15px"></div></div><b>${y.calls}</b></div>`).join('')}</div><table class="v5-table"><thead><tr><th>Vuosi</th><th>Harjoituskirjauksia</th><th>Muita merkintöjä</th></tr></thead><tbody>${synthetic.map(y=>`<tr><td>${y.year}</td><td>${y.calls}</td><td>${y.incidents}</td></tr>`).join('')}</tbody></table><small class="v5-muted">Harjoitusluvut eivät perustu todelliseen PRONTO-aineistoon.</small></div><label class="v5-label" for="statAnswer">Vastauksesi prosentteina</label><input id="statAnswer" class="v5-input" type="text" inputmode="decimal" placeholder="Esim. 14,6"><p><button id="submitTask" class="btn btn-red">Tarkista lasku</button></p>`;
 }else if(t.type==='essay'){
  area.innerHTML=`<label class="v5-label" for="essayAnswer">Perustele ratkaisu</label><textarea class="v5-textarea" id="essayAnswer" style="min-height:230px" placeholder="Kirjoita vähintään neljä virkettä…"></textarea><p class="v5-muted">Teksti pysyy vain tässä näkymässä, ellet erikseen kopioi sitä. Automaattista arvosanaa ei anneta.</p><button id="submitTask" class="btn btn-red">Näytä arviointikriteerit</button>`;
 }
 $('#submitTask').addEventListener('click',evaluateTask);
}
function drawOrder(t){
 const element=$('#ordered');if(!element)return;
 element.innerHTML=taskOrder.map((idx,pos)=>`<div class="v5-card v5-row" style="margin-bottom:9px"><b style="width:25px;color:#ff9296">${pos+1}</b><span style="flex:1">${esc(t.parts[idx])}</span><button class="v5-smallbtn" data-move="${pos},-1" ${pos===0?'disabled':''} aria-label="Siirrä ylös">↑</button><button class="v5-smallbtn" data-move="${pos},1" ${pos===taskOrder.length-1?'disabled':''} aria-label="Siirrä alas">↓</button></div>`).join('');
 $$('[data-move]',element).forEach(btn=>btn.addEventListener('click',()=>{
  const [at,delta]=btn.dataset.move.split(',').map(Number);
  const dest=at+delta;if(dest<0||dest>=taskOrder.length)return;
  [taskOrder[at],taskOrder[dest]]=[taskOrder[dest],taskOrder[at]];
  drawOrder(t);
 }));
}
function evaluateTask(){
 const t=currentTask,out=$('#taskResult');let good=false,message='';
 if(t.type==='order'){
  good=taskOrder.every((idx,pos)=>idx===pos);
  message=`${good?'Kaikki vaiheet oikein.':'Järjestyksessä on vielä korjattavaa.'} ${t.explain}`;
 }else if(t.type==='multi'){
  const chosen=$$('.multiAnswer:checked').map(e=>Number(e.value)).sort((a,b)=>a-b);
  good=JSON.stringify(chosen)===JSON.stringify(t.right);
  message=`${good?'Valinnat ovat oikein.':'Valinnoissa on puutteita tai ylimääräisiä kohtia.'} ${t.explain}`;
 }else if(t.type==='number'){
  const value=Number($('#statAnswer').value.replace(',','.'));
  good=$('#statAnswer').value.trim()!==''&&Math.abs(value-t.answer)<=0.11;
  message=`${good?'Lasku oikein.':'Tarkista laskutapa.'} ${t.explain}`;
 }else{
  const value=$('#essayAnswer').value.trim();
  if(value.length<60){out.innerHTML='<div class="v5-feedback warn">Kirjoita perustelu hieman laajemmin ennen itsearviointia.</div>';return;}
  message='Vertaa vastaustasi arviointikriteereihin. Tämä ei ole automaattisesti arvioitu koe: <ul>'+t.rubric.map(r=>`<li>${esc(r)}</li>`).join('')+'</ul>';
 }
 if(good){tasksDone[t.id]=true;storeSet(STORAGE_QUIZ,tasksDone);}
 out.innerHTML=`<div class="v5-feedback ${!good&&t.type!=='essay'?'warn':''}"><strong>${t.type==='essay'?'Itsearviointi':good?'Hyväksytty harjoitus':'Pohdi uudelleen'}</strong><div>${message}</div></div>`;
 out.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function downloadJSON(obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=el('a',{href:url,download:'valmiro-harjoitus.json'});a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function importJSON(event){
 const file=event.target.files?.[0];if(!file)return;
 if(file.size>1024*1024){alert('Tiedosto on liian suuri (enintään 1 Mt).');return;}
 try{
  const incoming=JSON.parse(await file.text());
  if(typeof incoming.title!=='string'||!Array.isArray(incoming.units)||!Array.isArray(incoming.cards)||incoming.units.length>30||incoming.cards.length>100)throw Error('invalid');
  const allowed=(value)=>String(value??'').slice(0,4000);
  plan={id:'p_'+Date.now(),title:allowed(incoming.title),date:allowed(incoming.date),duration:allowed(incoming.duration),place:allowed(incoming.place),group:allowed(incoming.group),leader:allowed(incoming.leader),goals:allowed(incoming.goals),safety:allowed(incoming.safety),notes:allowed(incoming.notes),finalFeedback:allowed(incoming.finalFeedback),units:incoming.units.map((u,i)=>({id:'u'+i,name:allowed(u.name),call:allowed(u.call),role:allowed(u.role),feedback:allowed(u.feedback)})),cards:incoming.cards.map((c,i)=>({id:'c'+i,phase:allowed(c.phase),target:allowed(c.target),trigger:allowed(c.trigger),expected:allowed(c.expected)}))};
  persistPlan();plannerScreen();
 }catch{alert('Tiedoston sisältö ei ole Valmiron harjoitussuunnitelma.');}
}

 $v('#v6Count').textContent=`(${draft.questions.length}/25)`;
 list.innerHTML=draft.questions.map((q,i)=>{
  const isChoice=q.type==='single'||q.type==='multiple'||q.type==='ordering';
  return `<article class="v6-item" data-qindex="${i}">
  <div class="v6-line"><strong>${i+1}. kysymys</strong><span class="v6-badge">1 piste</span><div><button class="v6-soft" data-act="up" data-index="${i}" ${i?'':'disabled'} aria-label="Siirrä kysymystä ylöspäin">↑</button> <button class="v6-soft" data-act="down" data-index="${i}" ${i<draft.questions.length-1?'':'disabled'} aria-label="Siirrä kysymystä alaspäin">↓</button> <button class="v6-soft" data-act="remove" data-index="${i}">Poista</button></div></div>
  <label class="v6-label">Tehtävätyyppi</label><select class="v6-control" data-prop="type" data-index="${i}">${[
   ['single','Monivalinta – yksi oikea'],['multiple','Monivalinta – useita oikeita'],['numeric','Lukutehtävä'],['ordering','Järjestystehtävä'],['text','Avoin perustelu']
  ].map(([value,label])=>`<option value="${value}" ${q.type===value?'selected':''}>${label}</option>`).join('')}</select>
  <label class="v6-label">Kysymysteksti</label><textarea class="v6-control" data-prop="prompt" data-index="${i}" maxlength="600">${escV(q.prompt)}</textarea>
  ${isChoice?`<label class="v6-label">${q.type==='ordering'?'Vaiheet oikeassa järjestyksessä (ylhäältä alas)':'Vastausvaihtoehdot – merkitse oikea(t)'}</label><div class="v6-options">${q.options.slice(0,7).map((o,j)=>`<label class="v6-option">${q.type==='ordering'?`<span class="v6-badge">${j+1}</span>`:`<input data-index="${i}" data-check="${j}" type="${q.type==='single'?'radio':'checkbox'}" name="v6corr${i}" ${q.correct.includes(j)?'checked':''}>`}<input class="v6-control" data-opt="${j}" data-index="${i}" value="${escV(o)}" maxlength="220" placeholder="Vaihtoehto ${j+1}"></label>`).join('')}</div>`:''}
  ${q.type==='numeric'?`<div class="v6-line"><label style="flex:1"><span class="v6-label">Oikea lukuarvo</span><input class="v6-control" data-prop="answer" data-index="${i}" value="${escV(q.answer)}" placeholder="Esim. 25"></label><label style="flex:1"><span class="v6-label">Hyväksytty poikkeama ±</span><input class="v6-control" data-prop="tolerance" data-index="${i}" type="number" min="0" step="any" value="${Number(q.tolerance)||0}"></label></div>`:''}
  ${q.type==='text'?`<label class="v6-label">Mallivastaus ja arviointikriteeri</label><textarea class="v6-control" data-prop="answer" data-index="${i}" maxlength="1200" placeholder="Kirjoita, mitä hyvästä vastauksesta pitäisi löytyä.">${escV(q.answer)}</textarea><p class="v6-muted">Avoimesta vastauksesta annetaan mallivastaus, mutta sitä ei pisteytetä automaattisesti.</p>`:''}
  </article>`;
 }).join('');
 list.querySelectorAll('[data-prop]').forEach(el=>el.addEventListener('input',e=>{
   const i=Number(e.target.dataset.index),prop=e.target.dataset.prop;draft.questions[i][prop]=e.target.value;
   if(prop==='type'){
    draft.questions[i].correct=[0];renderQuestions();
   }
   saveDraft(true);
 }));
 list.querySelectorAll('[data-opt]').forEach(el=>el.addEventListener('input',e=>{draft.questions[Number(el.dataset.index)].options[Number(el.dataset.opt)]=e.target.value;saveDraft(true)}));
 list.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',e=>{
   const i=Number(el.dataset.index),j=Number(el.dataset.check),q=draft.questions[i];
   if(q.type==='single')q.correct=[j];
   else if(el.checked)q.correct=[...new Set([...q.correct,j])].sort((a,b)=>a-b);
   else q.correct=q.correct.filter(x=>x!==j);
   saveDraft(true);
 }));
 list.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',e=>{
   const i=Number(el.dataset.index),act=el.dataset.act;
   if(act==='remove'){draft.questions.splice(i,1)}
   if(act==='up'&&i>0)[draft.questions[i-1],draft.questions[i]]=[draft.questions[i],draft.questions[i-1]];
   if(act==='down'&&i<draft.questions.length-1)[draft.questions[i+1],draft.questions[i]]=[draft.questions[i],draft.questions[i+1]];
   renderQuestions();saveDraft(true);
 }));
}
function validDraft(){
 if(!draft.title.trim()){notice('Anna kokeelle nimi.','error');return false}
 if(!draft.questions.length){notice('Lisää vähintään yksi kysymys.','error');return false}
 for(const [i,q] of draft.questions.entries()){
  if(!q.prompt.trim()){notice('Kysymyksestä '+(i+1)+' puuttuu teksti.','error');return false}
  if(['single','multiple','ordering'].includes(q.type)){
   if(q.options.filter(x=>x.trim()).length<2 || q.options.some(x=>!x.trim())){notice('Kysymyksen '+(i+1)+' kaikki neljä vaihtoehtoa/vaihetta pitää täyttää.','error');return false}
   if(q.type!=='ordering'&&!q.correct.length){notice('Merkitse oikea vastaus kysymykseen '+(i+1)+'.','error');return false}
  }
  if(q.type==='numeric'&&(!q.answer.trim()||!Number.isFinite(Number(q.answer.replace(',','.'))))){notice('Tarkista lukuarvo kysymyksessä '+(i+1)+'.','error');return false}
  if(q.type==='text'&&!q.answer.trim()){notice('Anna mallivastaus kysymykseen '+(i+1)+'.','error');return false}
 }
 return true;
}
async function publish(){
 if(!validDraft())return;
 if(!API){notice('Määritä ensin EXAM_API. Lyhyttä koodia ei voi julkaista ilman palvelinta.','error');return}
 const key=$v('#v6TeacherKey').value.trim();
 if(!key){notice('Anna Cloudflare-palvelimelle määrittämäsi julkaisusalaisuus.','error');return}
 const btn=$v('#v6Publish');btn.disabled=true;btn.textContent='Julkaistaan…';
 try{
  const r=await fetch(API+'/exams',{method:'POST',headers:{'Content-Type':'application/json','x-valmiro-editor-key':key},body:JSON.stringify({exam:cleanExam(draft)})});
  const json=await r.json().catch(()=>({}));if(!r.ok)throw Error(json.error||'Palvelinvirhe '+r.status);
  publishedCode=json.code;
  const url=location.href.split('#')[0]+'#/liity?code='+encodeURIComponent(json.code);
  $v('#v6Published').innerHTML=`<div class="v6-notice success"><b>Koe julkaistu!</b><div class="v6-code">${escV(json.code)}</div><p class="v6-muted">Voimassa ${escV(json.expiresDays||14)} päivää. Koodi toimii eri laitteilla.</p><button class="v6-soft" id="v6CopyLink">Kopioi liittymislinkki</button><button class="v6-soft" id="v6CopyCode">Kopioi koodi</button></div>`;
  $v('#v6CopyLink').addEventListener('click',()=>navigator.clipboard.writeText(url).then(()=>notice('Linkki kopioitu.','success')));
  $v('#v6CopyCode').addEventListener('click',()=>navigator.clipboard.writeText(json.code).then(()=>notice('Koodi kopioitu.','success')));
  notice('Koe julkaistu onnistuneesti.','success');
 }catch(e){notice('Julkaisu epäonnistui: '+e.message,'error')}
 finally{btn.disabled=false;btn.textContent='Julkaise ja luo koodi'}
}

 <div class="v6-line"><input class="v6-control" style="flex:1;letter-spacing:3px;text-transform:uppercase" id="v6JoinCode" autocomplete="off" inputmode="text" maxlength="10" placeholder="Esim. H7K9PTQ2" value="${escV(candidate)}"><button class="v6-red" id="v6Join">Liity kokeeseen →</button></div>

async function joinCode(){

 const status=$v('#v6JoinStatus');
 if(!/^[A-HJ-NP-Z2-9]{8}$/.test(code)){status.textContent='Koodi on kahdeksan merkkiä (kirjaimia ja numeroita).';return}

 status.textContent='Haetaan koetta…';
 try{const r=await fetch(API+'/exams/'+encodeURIComponent(code),{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Koetta ei löytynyt');currentExam=cleanExam(j.exam);publishedCode=code;studentAnswers={};status.textContent='Koe löytyi: '+currentExam.title;renderStudent()}
 catch(err){status.textContent='Kokeen avaaminen epäonnistui: '+err.message+' (uuden kokeen julkaisu voi näkyä pienellä viiveellä).'}

function renderStudent(){
 const box=$v('#v6Quiz');if(!box||!currentExam)return;
 box.innerHTML=`<div class="v6-pane v6-student" style="margin-top:22px"><span class="v6-kicker">KOESUORITUS</span><h2>${escV(currentExam.title)}</h2><p class="v6-muted">${escV(currentExam.instructions)}</p><div id="v6StudentQs"></div><div class="v6-actions"><button class="v6-red" id="v6Finish">Tarkista vastaukset</button></div><div id="v6Feedback" aria-live="polite"></div></div>`;
 $v('#v6StudentQs').innerHTML=currentExam.questions.map((q,i)=>{
  const content=q.type==='single'||q.type==='multiple'?q.options.map((choice,j)=>`<label class="v6-choice"><input type="${q.type==='single'?'radio':'checkbox'}" name="v6s${i}" value="${j}"><span>${escV(choice)}</span></label>`).join('')
   :q.type==='numeric'?`<label class="v6-label">Vastaus numerona</label><input type="text" class="v6-control" inputmode="decimal" data-num="${i}" placeholder="Esim. 12,5">`
   :q.type==='text'?`<label class="v6-label">Kirjallinen vastaus</label><textarea class="v6-control" data-text="${i}" placeholder="Kirjoita perustelusi tähän…"></textarea>`
   :`<p class="v6-muted">Siirrä vaiheita oikeaan järjestykseen nuolilla.</p><div id="v6Order${i}"></div>`;
  return `<article class="v6-item" style="margin:18px 0"><strong>${i+1}. ${escV(q.prompt)}</strong><div style="margin-top:12px">${content}</div></article>`;
 }).join('');
 currentExam.questions.forEach((q,i)=>{if(q.type==='ordering'){
  const order=q.options.map((_,j)=>j);for(let j=order.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]]} studentAnswers[i]=order;renderOrder(i);
 }});
 $v('#v6Finish').addEventListener('click',finishExam);
}
function renderOrder(i){const q=currentExam.questions[i],order=studentAnswers[i],target=$v('#v6Order'+i);if(!target)return;
 target.innerHTML=order.map((original,j)=>`<div class="v6-order-row"><span>${j+1}. ${escV(q.options[original])}</span><button type="button" class="v6-chip" data-order-move="up" data-pos="${j}" ${j===0?'disabled':''}>↑</button><button type="button" class="v6-chip" data-order-move="down" data-pos="${j}" ${j===order.length-1?'disabled':''}>↓</button></div>`).join('');
 target.querySelectorAll('[data-order-move]').forEach(b=>b.addEventListener('click',()=>{const k=Number(b.dataset.pos),l=k+(b.dataset.orderMove==='up'?-1:1);[order[k],order[l]]=[order[l],order[k]];renderOrder(i)}));
}
function finishExam(){
 if(!currentExam)return;
 let total=0,earned=0,manual=0;const details=[];
 for(const [i,q] of currentExam.questions.entries()){
  if(q.type==='text'){
   const response=$v(`[data-text="${i}"]`)?.value.trim()||'';
   if(!response){$v('#v6Feedback').innerHTML='<div class="v6-notice error">Vastaa myös kaikkiin avoimiin kysymyksiin.</div>';return}
   manual++;
   details.push(`<div class="v6-results"><strong>${i+1}. Avoin vastaus – arvioi malliin verraten</strong><p><b>Oma vastauksesi:</b> ${escV(response)}</p><p><b>Mallivastaus:</b> ${escV(q.answer)}</p></div>`);
   continue;
  }
  let correct=false;
  if(q.type==='single'||q.type==='multiple'){
   const vals=Array.from(document.querySelectorAll(`input[name="v6s${i}"]:checked`)).map(el=>Number(el.value));
   if(!vals.length){$v('#v6Feedback').innerHTML='<div class="v6-notice error">Vastaa kaikkiin monivalintoihin.</div>';return}
   correct=vals.slice().sort().join(',')===q.correct.slice().sort().join(',');
  }else if(q.type==='numeric'){
   const raw=$v(`[data-num="${i}"]`)?.value.trim().replace(',','.');
   if(!raw||!Number.isFinite(Number(raw))){$v('#v6Feedback').innerHTML='<div class="v6-notice error">Tarkista kaikki numeeriset vastaukset.</div>';return}
   correct=Math.abs(Number(raw)-Number(String(q.answer).replace(',','.')))<=Number(q.tolerance||0)+1e-9;
  }else if(q.type==='ordering')correct=studentAnswers[i].every((v,j)=>v===j);
  total++;if(correct)earned++;
  const expected=q.type==='numeric'?q.answer:q.type==='ordering'?q.options.map((x,j)=>(j+1)+'. '+x).join(' → '):q.options.filter((_,j)=>q.correct.includes(j)).join('; ');
  details.push(`<div class="v6-results"><strong>${i+1}. ${correct?'Oikein':'Ei oikein'}</strong><p class="v6-muted">${correct?'Hyvä.':'Oikea ratkaisu: '+escV(expected)}</p></div>`);
 }
 const pc=total?Math.round(100*earned/total):null;
 $v('#v6Feedback').innerHTML=`<div class="v6-results"><div class="v6-score">${pc===null?'Avoimet vastaukset':pc+' %'}</div><p>${earned} / ${total} automaattisesti arvioitavaa tehtävää oikein. ${manual?'Lisäksi '+manual+' avointa vastausta, jotka verrataan itse malliin.':''}</p><p class="v6-muted">Tulosta ei lähetetty palvelimelle eikä julkaistu muiden nähtäväksi.</p></div>${details.join('')}`;
 $v('#v6Finish').disabled=true;
 $v('#v6Feedback').scrollIntoView({behavior:'smooth',block:'start'});
}

 }

 no?.addEventListener('click',()=>{try{localStorage.removeItem(DRAFT_KEY)}catch{}});

<script id="valmiro-7-script">
/* ============================================================
   VALMIRO 7.0 | APPLICATION EXTENSIONS
   Compatible with the original 8 courses, exercises, training
   planner, assessment builder and Cloudflare Workers endpoint.
   All student answers remain local to the browser.
   ============================================================ */
(()=>{
'use strict';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 return `<article class="v7-tool-card"><div class="v7-tool-icon" aria-hidden="true">${icon(ic)}</div><b>${E(title)}</b><p>${E(desc)}</p><button type="button" class="btn btn-muted btn-small" data-go="${E(route)}">${E(button)} →</button></article>`;

function polishJoin(){
 const input=el('v6JoinCode'),btn=el('v6Join'),status=el('v6JoinStatus');
 if(!input||!btn)return;
 const section=input.closest('section');
 const parent=input.closest('.v6-pane');
 if(section)section.classList.add('v7-join-section');
 if(parent){parent.classList.add('v7-narrow');parent.classList.remove('v6-student');}
 const row=input.closest('.v6-line');if(row)row.classList.add('v7-join-row');
 input.classList.add('v7-join-code');input.placeholder='A47LHMK7';
 input.setAttribute('aria-label','Kahdeksanmerkkinen liittymiskoodi');
 input.setAttribute('autocapitalize','characters');
 input.addEventListener('input',()=>{
  input.value=input.value.toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g,'').slice(0,8);
 });
 btn.textContent='Avaa koe →';
 if(status){status.classList.add('v7-join-help');}
 const quiz=el('v6Quiz');if(quiz)quiz.classList.add('v7-join-result');
 const file=el('v6StudentFile');if(file){
   const details=document.createElement('details');details.className='v7-join-help';
   details.innerHTML='<summary style="cursor:pointer;color:#bed0e5;font-weight:700">Avaa koe tiedostosta (JSON)</summary><p>Voit avata myös kouluttajan jakaman koetiedoston.</p>';
   file.before(details);details.appendChild(file);
   const hr=parent?.querySelector('.v6-divider');if(hr)hr.remove();
   const headline=file.parentElement?.parentElement?.querySelector('h3');
   if(headline&&headline.textContent.includes('koetiedosto'))headline.remove();
 }
 // The actual Cloudflare fetching and response rendering still use
 // the existing 6.0 event listeners, so no API code is duplicated.
}
function polishExamEditor(){
 const pane=el('v6TeacherKey')?.closest('.v6-pane');
 if(pane){pane.classList.add('v7-editor-sidebar');const old=el('v6Published');if(old)old.style.maxWidth='100%';}
 const wrapper=el('v6QuestionList')?.closest('.v6-pane');

function csvParse(src){const result=[],row=[];let cur='',quoted=false;for(let i=0;i<src.length;i++){const c=src[i];if(c==='"'){if(quoted&&src[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(!quoted&&(c===','||c===';'||c==='\t')){row.push(cur);cur=''}else if(!quoted&&(c==='\n'||c==='\r')){if(c==='\r'&&src[i+1]==='\n')i++;row.push(cur);if(row.some(s=>s.trim()))result.push([...row]);row.length=0;cur='';if(result.length>6000)break}else cur+=c}row.push(cur);if(row.some(s=>s.trim()))result.push([...row]);return result}
function statPage(){BODY.innerHTML=page('OPPIMINEN / AINEISTON TULKINTA','Tilastoasema','Tutki itse valitsemaasi CSV-taulukkoa. Valitse luokat ja lukuarvot, katso vertailu ja muodosta laskentatehtävä.')+`<div class="vm8-main"><div class="vm8-focus"><div class="vm8-panel"><div class="eyebrow">1 / AINEISTON TUONTI</div><p class="vm8-lead">Taulukko käsitellään tässä selaimessa, eikä sitä lähetetä palvelimelle. Älä tuo henkilötietoja. Voit käyttää esimerkiksi julkisen tilastojulkaisun CSV-aineistoa, jonka käyttöehdot sallivat käsittelyn.</p><label class="vm8-field"><span class="vm8-label">CSV-tiedosto (enintään 1 Mt)</span><input id="vm8CsvFile" class="vm8-control" type="file" accept=".csv,text/csv,text/plain"></label><div class="vm8-actions"><button class="btn btn-muted" id="vm8CsvExample">Avaa kuvitteellinen esimerkkiaineisto</button><button class="btn btn-muted" id="vm8CsvClear">Tyhjennä aineisto</button></div><div class="vm8-columns" style="margin:22px 0"><label class="vm8-field"><span class="vm8-label">Luokkakenttä</span><select class="vm8-control" id="vm8CsvX"></select></label><label class="vm8-field"><span class="vm8-label">Lukuarvokenttä</span><select class="vm8-control" id="vm8CsvY"></select></label></div><div class="vm8-status" id="vm8CsvStatus" aria-live="polite"></div><div id="vm8CsvData"></div></div><aside class="vm8-stack"><div class="vm8-panel"><div class="eyebrow">2 / LASKENTA</div><h2>Vertaa havaintoja</h2><div id="vm8CsvMath" class="vm8-stack"></div></div><div class="vm8-panel"><h3>Aineiston käyttö</h3><p class="vm8-muted">Jos käytät oikeita tilastoja, merkitse niiden alkuperäinen julkaisija, havaintovuodet ja yksiköt. Tämä näkymä ei lisää lähdemerkintää automaattisesti.</p>${field('vm8CsvSource','Lähde / julkaisu','','',{placeholder:'Esim. julkaisun nimi ja vuosi'})}<div class="vm8-actions"><button class="btn btn-muted" id="vm8CsvReport">Tulosta yhteenveto</button></div></div></aside></div></div>`;
const readNum=x=>{const cleaned=String(x).trim().replace(/\s/g,'').replace(',','.');if(!cleaned)return null;const n=Number(cleaned);return Number.isFinite(n)?n:null};
function draw(){const x=$8('#vm8CsvX'),y=$8('#vm8CsvY');if(!statHeaders.length){x.innerHTML='<option>Tuo aineisto</option>';y.innerHTML='<option>Tuo aineisto</option>';$8('#vm8CsvData').innerHTML='';$8('#vm8CsvMath').textContent='Ei aineistoa.';return}x.innerHTML=statHeaders.map(h=>`<option ${h===statX?'selected':''}>${H(h)}</option>`).join('');y.innerHTML=statHeaders.map(h=>`<option ${h===statY?'selected':''}>${H(h)}</option>`).join('');const ix=statHeaders.indexOf(statX),iy=statHeaders.indexOf(statY),agg=new Map();for(const row of statRows){const key=String(row[ix]||'').slice(0,100)||'(tyhjä)',num=readNum(row[iy]);if(num===null)continue;agg.set(key,(agg.get(key)||0)+num)}const series=[...agg.entries()].sort((a,b)=>b[1]-a[1]).slice(0,25);const max=Math.max(1,...series.map(x=>Math.abs(x[1])));const sum=series.reduce((a,b)=>a+b[1],0);$8('#vm8CsvStatus').textContent=`${H(statFilename)} · ${statRows.length} riviä · ${series.length} luokkaa vertailussa`;$8('#vm8CsvData').innerHTML=`<h3>Luokkien vertailu</h3>${series.map(([label,num])=>`<div class="vm8-csvbar"><span title="${H(label)}">${H(label.length>12?label.slice(0,11)+'…':label)}</span><div class="track"><span style="width:${Math.max(0,Math.min(100,Math.round(Math.abs(num)/max*100)))}%"></span></div><b>${num.toLocaleString('fi-FI')}</b></div>`).join('')||'<p class="vm8-note">Valitussa sarakkeessa ei ole tulkittavia lukuja.</p>'}`;$8('#vm8CsvMath').innerHTML=series.length>=2?`<div class="vm8-stat"><strong>${sum.toLocaleString('fi-FI')}</strong><small>Yhteensä näytetyissä luokissa</small></div><p>Vertaa kahta valitsemaasi luokkaa ja laske muutosprosentti.</p><select class="vm8-control" id="vm8RefA">${series.map(([v],i)=>`<option value="${i}">${H(v)}</option>`).join('')}</select><select class="vm8-control" id="vm8RefB">${series.map(([v],i)=>`<option value="${i}" ${i===1?'selected':''}>${H(v)}</option>`).join('')}</select>${field('vm8UserPercent','Muutosprosentti A:sta B:hen','','',{placeholder:'Esim. -12,5'})}<button class="btn btn-red" id="vm8PercentCheck">Tarkista lasku</button><div class="vm8-status" id="vm8PctStatus"></div>`:`<p class="vm8-muted">Tarvitset vähintään kaksi luokkaa ja lukuarvoja.</p>`;const check=$8('#vm8PercentCheck');if(check)check.addEventListener('click',()=>{const a=series[Number($8('#vm8RefA').value)]?.[1],b=series[Number($8('#vm8RefB').value)]?.[1],value=readNum($8('#vm8UserPercent').value);$8('#vm8PctStatus').textContent=a===0?'Lähtöarvo on nolla: tavallista prosenttimuutosta ei voi laskea.':value===null?'Syötä luku.':Math.abs(value-((b-a)/a*100))<0.16?'Oikein. Perustelu: (B − A) / A × 100.':`Tarkista. Kaava on (B − A) / A × 100. Oikea tulos on ${((b-a)/a*100).toFixed(1).replace('.',',')} %. `})}

 'book':'<path d="M4 5.5c4-1.5 6-1 8 1 2-2 4-2.5 8-1v14c-4-1.5-6-1-8 1-2-2.5-4-2.5-8-1zM12 6.5v14"/>',
 'play':'<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/>',

function tile(path,title,detail,ico){const button=make('button','vm9-tile');button.type='button';button.dataset.go=path;button.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[ico]||icons.list}</svg>`;button.append(make('strong','',title),make('small','',detail),make('em','','Avaa →'));return button}
function workSection(step,title,description,items){const sec=make('section','vm9-worksection');sec.append(make('span','eyebrow',step),make('h2','',title),make('p','',description));const list=make('div','vm9-tiles');for(const item of items)list.append(tile(...item));sec.append(list);return sec}
function simplifyWorkspace(){const root=document.querySelector('.vm8-main > .vm8-grid');if(!root||root.dataset.vm9Done)return;const flow=make('div','vm9-workflows');flow.dataset.vm9Done='1';flow.append(workSection('01 / VALMISTELE','Suunnittele harjoitus','Valitse oma suunnitelma, valmis pohja tai kouluttajan koe.',[
 ['/rastistudio','Rastistudio','Yksiköt, tilannekortit ja tulostettavat tehtävät.','edit'],
 ['/harjoituspankki','Harjoituspankki','Avaa valmis runko ja muokkaa se ryhmällesi.','book'],
 ['/koeluoja','Luo koe','Kysymykset ja julkaisu liittymiskoodilla.','list']
]));flow.append(workSection('02 / HARJOITUKSESSA','Ohjaa ja arvioi','Työkalut harjoitustilanteen aikana ja sen jälkeen.',[
 ['/ohjaamo','Harjoituksen ohjaamo','Aikajana, tilannekortit ja kouluttajan havainnot.','play'],
 ['/matriisi','Arviointimatriisi','Arvioi suorituksia ja tulosta palautteet.','check'],
 ['/tyokalut','Kouluttajan apuvälineet','Rastikello ja valmistelun tarkistuslista.','chart']
]));const more=make('details','vm9-more');more.append(make('summary','', 'Muut työkalut (tarvittaessa)'));const moreGrid=make('div','vm9-tiles');for(const item of [
 ['/tilastoasema','Tilastoasema','Harjoittele omilla CSV-aineistoilla.','chart'],
 ['/vuosikello','Koulutusvuosikello','Vuoden harjoitusten suunnitteluun.','list'],
 ['/taitokortit','Taitokortit','Kertaa aiheita lyhyillä korteilla.','book'],
 ['/julkaisu','Julkaisun laatutarkastus','Valmiron ylläpidon tarkistuslista.','check']])moreGrid.append(tile(...item));more.append(moreGrid);flow.append(more);root.replaceWith(flow)}

}
markCurrent();if(location.hash.split('?')[0]==='#/tyopoyta')simplifyWorkspace();
